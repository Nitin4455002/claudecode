    color:var(--rf-purple);
  }

  /* Suggestion selector — the "we found 3 schemas" screen */
  .suggest-card{
    background:var(--rf-bg-card);
    border:1px solid var(--rf-border-2);
    border-radius:12px;
    padding:14px 16px;
    margin-bottom:10px;
    display:grid;
    grid-template-columns:auto 1fr auto;
    gap:14px;
    align-items:flex-start;
  }
  .suggest-card.selected{
    border-color:var(--rf-purple-line);
    background:var(--rf-purple-soft-2);
  }
  .suggest-checkbox{
    width:22px; height:22px;
    border:1.5px solid var(--rf-border-strong);
    border-radius:6px;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
    margin-top:2px;
    flex:0 0 22px;
  }
  .suggest-checkbox.checked{
    background:var(--rf-purple);
    border-color:var(--rf-purple);

  }
  .suggest-meta .title-row{

  }
  .suggest-meta .name{
    font-size:14px; font-weight:600;
  }

    font-size:9px; font-weight:700; letter-spacing:0.5px;

    padding:2px 7px;

    color:var(--rf-green);
  }
  .suggest-tag.optional{
    background:rgba(155,161,174,0.10);
    color:var(--rf-text-muted);
  }
  .suggest-meta .desc{
    font-size:12.5px; color:var(--rf-text-muted);
    line-height:1.5;
  }
  .suggest-meta .preview{
    margin-top:6px;
    font-size:11px;
    color:var(--rf-text-dim);
    font-family:'JetBrains Mono', monospace;
  }
  .suggest-meta .conflict-note{
    margin-top:8px;
    padding:8px 10px;
    background:rgba(245,185,25,0.06);
    border:1px solid rgba(245,185,25,0.20);
    border-radius:7px;
    font-size:11.5px; color:var(--rf-amber);
    display:flex; align-items:center; gap:6px;
  }
  .suggest-meta .conflict-note.success{
    background:rgba(74,222,128,0.06);
    border-color:rgba(74,222,128,0.20);
    color:var(--rf-green);
  }
  .suggest-card-action{
    color:var(--rf-text-dim); font-size:11.5px;
    cursor:pointer;
  }

  .progress-bar-wrap{
    display:flex; align-items:center; gap:14px;
    margin-top:18px;
  }
  .progress-bar{
    flex:1; height:6px;
    background:var(--rf-bg-card-3);
    border-radius:99px;
    overflow:hidden;
    position:relative;
  }
  .progress-bar .fill{
    position:absolute;
    inset:0 auto 0 0;

    border-radius:99px;
  }
  .progress-bar-label{
    color:var(--rf-text-muted); font-size:12px;
  }

  /* ============================================================
     SCHEMA FORM EDITOR + VALIDATION
     ============================================================ */
  .editor-head{
    display:flex; align-items:flex-start; gap:14px;
    margin-bottom:6px;
  }
  .editor-head-text h2{
    margin:0; font-size:20px; font-weight:600;
  }
  .editor-head-text p{
    margin:2px 0 0; font-size:12.5px; color:var(--rf-text-muted);
  }
  .editor-back{
    margin-left:auto;
    display:inline-flex; align-items:center; gap:5px;
    color:var(--rf-text-muted);
    font-size:13px;
    cursor:pointer;
  }
  .editor-tabs{
    display:flex; gap:24px;
    border-bottom:1px solid var(--rf-border);
    margin:14px 0 20px;
  }
  .editor-tab{
    display:inline-flex; align-items:center; gap:6px;
    padding:8px 0;
    font-size:13px; font-weight:500;
    color:var(--rf-text-muted);
    cursor:pointer;
    position:relative;
  }
  .editor-tab.active{ color:var(--rf-purple); }
  .editor-tab.active::after{
    content:""; position:absolute;
    left:0; right:0; bottom:-1px;
    height:2px; background:var(--rf-purple);
    border-radius:2px;
  }
  .ext-badge{
    font-size:9px; font-weight:700; letter-spacing:0.5px;
    background:rgba(155,161,174,0.10);
    color:var(--rf-text-muted);
    padding:2px 5px;
    border-radius:4px;
  }
  .editor-tab.error-tab{ color:var(--rf-red); }
  .editor-tab.error-tab .err-count{
    background:var(--rf-red);
    color:#fff;
    font-size:10px;
    padding:1px 6px;
    border-radius:99px;
    font-weight:700;
    margin-left:6px;
  }

  .editor-card{
    background:var(--rf-bg-card);
    border:1px solid var(--rf-border);
    border-radius:12px;
    padding:20px 22px;
  }
  .field-group{
    display:grid; grid-template-columns:1fr 1fr;
    gap:16px 16px;
    margin-bottom:18px;
  }
  .field-group.single{ grid-template-columns:1fr; }
  .field{ display:flex; flex-direction:column; gap:6px; }
  .field label{
    font-size:13px; font-weight:500;
    color:var(--rf-text);
    display:flex; align-items:center; gap:6px;
  }
  .field label .req{ color:var(--rf-red); }
  .field label .hint{
    font-size:11px; color:var(--rf-text-dim);
    font-weight:400;
    margin-left:auto;
  }
  .field .input,
  .field .textarea,
  .field .select{
    background:var(--rf-bg-input);
    border:1px solid var(--rf-border-2);
    color:var(--rf-text);
    font-family:inherit;
    font-size:13px;
    padding:9px 11px;
    border-radius:7px;
    min-height:38px;
    outline:none;
  }
  .field .input::placeholder,
  .field .textarea::placeholder{
    color:var(--rf-text-faint);
  }
  .field .textarea{ min-height:74px; resize:vertical; line-height:1.5; }
  .field .select{
    appearance:none; -webkit-appearance:none;
    background-image:linear-gradient(45deg, transparent 50%, var(--rf-text-muted) 50%),
                     linear-gradient(135deg, var(--rf-text-muted) 50%, transparent 50%);
    background-position:calc(100% - 16px) center, calc(100% - 11px) center;
    background-size:5px 5px;
    background-repeat:no-repeat;
    padding-right:30px;
  }
  .field.invalid .input,
  .field.invalid .textarea,
  .field.invalid .select{
    border-color:var(--rf-red);
    background:rgba(221,82,76,0.04);
  }
  .field .err{
    font-size:11.5px;
    color:var(--rf-red);
    display:flex; align-items:center; gap:4px;
  }
  .field .ok{
    font-size:11.5px;
    color:var(--rf-green);
    display:flex; align-items:center; gap:4px;
  }
  .field .char-count{
    align-self:flex-end;
    font-size:11px;
    color:var(--rf-text-dim);
  }
  .field .with-prefix{
    display:flex;
    border:1px solid var(--rf-border-2);
    border-radius:7px;
    overflow:hidden;
    background:var(--rf-bg-input);
  }
  .field .with-prefix .prefix{
    padding:9px 12px;
    background:rgba(255,255,255,0.03);
    color:var(--rf-text-muted);
    font-size:12px;
    border-right:1px solid var(--rf-border-2);
    display:flex; align-items:center;
    min-width:90px;
  }
  .field .with-prefix .input{
    border:0; background:transparent;
    border-radius:0;
    flex:1;
  }

  .form-section-head{
    font-size:11px; font-weight:700;
    color:var(--rf-text-dim);
    letter-spacing:1px;
    text-transform:uppercase;
    margin:8px 0 14px;
    display:flex; align-items:center; gap:8px;
  }
  .form-section-head .ico-sm{
    color:var(--rf-text-dim);
  }
  .form-section-head .optional{
    font-size:10px; color:var(--rf-text-faint);
    font-weight:500; text-transform:none; letter-spacing:0;
  }
  .form-section-head .add-link{
    margin-left:auto;
    font-size:12px;
    color:var(--rf-purple);
    cursor:pointer;
    display:inline-flex; align-items:center; gap:4px;
  }
  .form-divider{
    height:1px;
    background:var(--rf-border);
    margin:18px 0;
  }

  /* repeater rows (faq pairs, edition rows, social profile rows) */
  .rep-row{
    display:flex; align-items:flex-start; gap:8px;
    margin-bottom:8px;
  }
  .rep-row .input{ flex:1; }
  .rep-trash{
    width:38px; height:38px;
    display:flex; align-items:center; justify-content:center;
    background:transparent;
    border:1px solid var(--rf-border-2);
    border-radius:7px;
    color:var(--rf-text-muted);
    cursor:pointer;
    flex:0 0 38px;
  }
  .rep-trash:hover{
    color:var(--rf-red);
    border-color:rgba(221,82,76,0.30);
  }
  .add-row-btn{
    display:inline-flex; align-items:center; gap:6px;
    color:var(--rf-purple);
    font-size:13px; font-weight:500;
    cursor:pointer;
    padding:4px 0;
  }

  /* Card for sub-entity (Author block in Article schema, etc) */
  .sub-card{
    background:var(--rf-bg-elev);
    border:1px solid var(--rf-border);
    border-radius:9px;
    padding:14px 16px;
    margin-bottom:10px;
  }

  /* Days-of-week toggle list (restaurant working hours) */
  .day-row{
    display:grid;
    grid-template-columns:64px 80px 1fr 1fr;
    gap:12px;
    align-items:center;
    padding:6px 0;
    border-bottom:1px solid var(--rf-border);
  }
  .day-row:last-child{ border-bottom:0; }
  .day-row .toggle-sm{
    width:34px; height:18px;
    border-radius:99px;
    background:var(--rf-bg-card-3);
    border:1px solid var(--rf-border-2);
    position:relative;
    cursor:pointer;
  }
  .day-row .toggle-sm .knob{
    position:absolute; top:1px; left:1px;
    width:14px; height:14px;
    border-radius:50%; background:#fff;
  }
  .day-row .toggle-sm.on{
    background:var(--rf-purple);
    border-color:var(--rf-purple);
  }
  .day-row .toggle-sm.on .knob{ left:17px; }
  .day-row .closed{
    color:var(--rf-text-dim);
    font-style:italic;
    font-size:12px;
  }

  /* Preview JSON block */
  .json-card{
    background:var(--rf-bg-card);
    border:1px solid var(--rf-border);
    border-radius:12px;
    padding:18px 20px;
    margin-bottom:18px;
  }
  .json-head{
    display:flex; align-items:center; justify-content:space-between;
    margin-bottom:12px;
  }
  .json-head h3{
    margin:0; font-size:15px; font-weight:600;
  }
  .json-copy{
    display:inline-flex; align-items:center; gap:6px;
    height:30px; padding:0 11px;
    background:var(--rf-bg-card-3);
    border:1px solid var(--rf-border-2);
    border-radius:7px;
    font-size:12px;
    color:var(--rf-text);
    cursor:pointer;
  }
  .json-block{
    background:var(--rf-bg);
    border:1px solid var(--rf-border);
    border-radius:9px;
    padding:14px 16px;
    font-family:'JetBrains Mono', monospace;
    font-size:11.5px;
    line-height:1.65;
    color:var(--rf-text-2);
    overflow:auto;
    max-height:380px;
  }
  .json-block .k{ color:#7DD3FC; }
  .json-block .s{ color:#A7F3D0; }
  .json-block .n{ color:#FDE68A; }
  .json-block .p{ color:#C4B5FD; }
  .json-block .br{ color:#9BA1AE; }

  /* validation panel */
  .validation-panel{
    background:var(--rf-bg-card);
    border:1px solid var(--rf-border);
    border-radius:12px;
    padding:18px 20px;
  }
  .validation-head{
    display:flex; align-items:center; gap:10px;
    margin-bottom:12px;
  }
  .validation-head h3{ margin:0; font-size:15px; font-weight:600; }
  .validation-head .summary-pill{
    margin-left:auto;
    font-size:11px; font-weight:600;
    padding:4px 10px; border-radius:99px;
  }
  .validation-head .summary-pill.pass{
    background:var(--rf-green-soft);
    color:var(--rf-green);
  }
  .validation-head .summary-pill.fail{
    background:var(--rf-red-soft);
    color:var(--rf-red);
  }
  .validation-head .summary-pill.warn{
    background:var(--rf-amber-soft);
    color:var(--rf-amber);
  }
  .v-row{
    display:grid;
    grid-template-columns:24px 1fr auto;
    gap:12px;
    align-items:flex-start;
    padding:10px 0;
    border-bottom:1px solid var(--rf-border);
  }
  .v-row:last-child{ border-bottom:0; }
  .v-row .v-ico{
    width:22px; height:22px;
    border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    flex:0 0 22px;
  }
  .v-row.pass .v-ico{ background:rgba(74,222,128,0.12); color:var(--rf-green); }
  .v-row.fail .v-ico{ background:var(--rf-red-soft); color:var(--rf-red); }
  .v-row.warn .v-ico{ background:rgba(245,185,25,0.12); color:var(--rf-amber); }
  .v-row .v-text strong{
    display:block; font-size:13px; font-weight:600; color:var(--rf-text);
  }
  .v-row .v-text small{
    display:block; font-size:11.5px; color:var(--rf-text-muted);
    margin-top:2px;
  }
  .v-row .v-fix{
    color:var(--rf-purple);
    font-size:11.5px; font-weight:600;
    cursor:pointer;
  }

  /* footer buttons inside editor */
  .editor-footer{
    display:flex; align-items:center; gap:10px;
    margin-top:18px;
  }
  .editor-footer .left-text{
    flex:1;
    color:var(--rf-text-muted);
    font-size:12px;
    display:flex; align-items:center; gap:8px;
  }
  .btn-secondary{
    display:inline-flex; align-items:center; gap:6px;
    background:var(--rf-bg-card-3);
    color:var(--rf-text);
    border:1px solid var(--rf-border-2);
    height:38px; padding:0 18px;
    border-radius:8px;
    font-size:13px; font-weight:500;
    cursor:pointer;
  }
  .btn-primary{
    display:inline-flex; align-items:center; gap:6px;
    background:linear-gradient(180deg, var(--rf-purple-btn-2) 0%, var(--rf-purple-btn) 100%);
    color:#fff;
    border:0;
    height:38px; padding:0 18px;
    border-radius:8px;
    font-size:13px; font-weight:600;
    cursor:pointer;
    box-shadow:0 0 18px var(--rf-purple-glow);
  }
  .btn-test-google{
    display:inline-flex; align-items:center; gap:6px;
    background:var(--rf-bg-card-3);
    color:var(--rf-text);
    border:1px solid var(--rf-border-2);
    height:38px; padding:0 15px;
    border-radius:8px;
    font-size:12.5px;
    cursor:pointer;
  }
  .btn-test-google .g{
    width:14px; height:14px;
    background:conic-gradient(from 0deg, #EA4335, #FBBC05, #34A853, #4285F4, #EA4335);
    border-radius:50%;
  }

  /* picker grid */
  .picker-grid{
    display:grid; grid-template-columns:1fr 1fr;
    gap:10px;
  }
  .picker-card{
    background:var(--rf-bg-card);
    border:1px solid var(--rf-border-2);
    border-radius:10px;
    padding:14px 16px;
    display:flex; align-items:center; gap:12px;
    cursor:pointer;
    position:relative;
  }
  .picker-card:hover{ border-color:var(--rf-border-strong); }
  .picker-card .ico{
    width:32px; height:32px;
    border-radius:7px;
    background:var(--rf-bg-card-3);
    display:flex; align-items:center; justify-content:center;
    color:var(--rf-text-muted);
    flex:0 0 auto;
  }
  .picker-card .meta{ flex:1; }
  .picker-card .name{
    font-size:13.5px; font-weight:600;
  }
  .picker-card .desc{
    font-size:11px; color:var(--rf-text-dim);
    margin-top:2px;
  }
  .picker-card .plus{
    color:var(--rf-text-muted);
    font-size:16px;
  }
  .picker-card.new-type::after{
    content:"NEW";
    position:absolute; top:8px; right:12px;

  }

  /* page picker */
  .page-search{
    display:flex; align-items:center; gap:8px;
    background:var(--rf-bg-input);
    border:1px solid var(--rf-border-2);
    border-radius:10px;
    padding:10px 14px;
    margin-bottom:12px;
  }
  .page-search input{
    flex:1;
    background:transparent; border:0; outline:0;
    color:var(--rf-text);
    font-size:13px;
    font-family:inherit;
  }
  .page-search input::placeholder{
    color:var(--rf-text-faint);
  }
  .page-picker-row{
    display:flex; align-items:center; gap:14px;
    padding:11px 14px;
    background:var(--rf-bg-card);
    border:1px solid var(--rf-border);
    border-radius:10px;
    margin-bottom:8px;
    cursor:pointer;

  }
  .page-picker-row .pp-ico{
    width:30px; height:30px;
    border-radius:7px;
    background:var(--rf-bg-card-3);
    display:flex; align-items:center; justify-content:center;
    color:var(--rf-text-muted);
    flex:0 0 30px;

  .page-picker-row .pp-meta .path{ font-size:13.5px; font-weight:600; }
  .page-picker-row .pp-meta .url{
    font-size:10.5px; color:var(--rf-text-dim);

  .page-picker-row .pp-source{

  }
  .page-picker-row .pp-source .badge{
    font-size:10px; font-weight:600;

    color:var(--rf-teal);

  }

  /* spinner */
  .spinner-wrap{
    text-align:center;
    padding:80px 24px;
    color:var(--rf-text-muted);
  }
  .spinner{
    width:36px; height:36px;
    border-radius:50%;

  .spinner-wrap p{ font-size:13.5px; margin:0; }
  .spinner-wrap small{
    display:block; margin-top:4px;

  /* ============================================================
     CONTACT SHEET (Screen 0 thumbnails)
     ============================================================ */
  .contact-sheet-wrap{
    background:rgba(255,255,255,0.015);
    border:1px solid var(--rf-border);
    border-radius:18px;
    padding:30px;
  }
  .cs-section-title{
    font-size:11px; font-weight:700;
    color:var(--rf-text-muted);
    letter-spacing:1.5px;
    text-transform:uppercase;
    padding:18px 4px 12px;
  }
  .contact-sheet{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(220px,1fr));
    gap:18px;
  }
  .cs-tile{
    background:var(--rf-bg-card);
    border:1px solid var(--rf-border);
    border-radius:12px;
    overflow:hidden;
    text-decoration:none;
    color:var(--rf-text);
    transition:transform 120ms, border-color 120ms;
    cursor:pointer;
    display:block;
  }
  .cs-tile:hover{
    transform:translateY(-2px);
    border-color:var(--rf-purple-line);
  }
  .cs-tile.new-screen{
    border-color:var(--rf-purple-line);
  }
  .cs-tile-thumb{
    aspect-ratio: 4/3;
    background:#0a0a0c;
    position:relative;
    overflow:hidden;
    border-bottom:1px solid var(--rf-border);
  }
  .cs-mini{
    position:absolute;
    top:0; left:0;
    width:680px;
    height:520px;
    transform-origin:top left;
    transform:scale(0.32);
    pointer-events:none;
  }
  .cs-tile-info{
    padding:12px 14px;
  }
  .cs-tile-num{
    font-family:'JetBrains Mono', monospace;
    font-size:10px;
    color:var(--rf-text-dim);
    letter-spacing:1px;
  }
  .cs-tile-title{
    font-size:13px; font-weight:600;
    margin-top:2px;
  }
  .cs-tile-tag{
    font-size:10.5px;
    color:var(--rf-text-muted);
    margin-top:3px;
  }
  .cs-tile.new-screen .cs-tile-num::before{
    content:"NEW · ";
    color:var(--rf-purple);
    font-weight:700;
  }

  /* ============================================================
     MISC
     ============================================================ */
  .icon{ width:16px; height:16px; display:inline-block; vertical-align:middle; }

  .key-card{
    background:rgba(255,255,255,0.02);
    border:1px solid var(--rf-border);
    border-radius:10px;
    padding:14px 16px;
    margin-top:10px;
    font-size:12px;
    color:var(--rf-text-muted);
    line-height:1.55;
  }
  .key-card strong{ color:var(--rf-text); font-weight:600; }
  .key-card code{
    background:rgba(255,255,255,0.05);
    padding:1px 5px;
    border-radius:4px;
    font-size:11px;
  }

  /* Banner shown across the top of plugin (cross-feature awareness) */
  .top-banner{
    display:flex; align-items:center; gap:10px;
    background:rgba(20,184,166,0.06);
    border:1px solid rgba(20,184,166,0.20);
    border-radius:9px;
    padding:10px 14px;
    margin-bottom:14px;
    font-size:12.5px;
    color:var(--rf-text-2);
  }
  .top-banner .ico{ color:var(--rf-teal); flex:0 0 auto; }
  .top-banner .link{
    margin-left:auto;
    color:var(--rf-teal);
    font-weight:600;
    cursor:pointer;
  }

  /* google rich result test result box */
  .google-result-box{
    background:var(--rf-bg-card);
    border:1px solid var(--rf-border);
    border-radius:11px;
    padding:14px 16px;
    margin-top:12px;
  }
  .grb-head{
    display:flex; align-items:center; gap:10px;
    margin-bottom:10px;
  }
  .grb-g{
    width:22px; height:22px;
    border-radius:50%;
    background:conic-gradient(from 0deg, #EA4335, #FBBC05, #34A853, #4285F4, #EA4335);
  }
  .grb-head strong{ font-size:13.5px; font-weight:600; }
  .grb-head small{
    margin-left:auto;
    font-size:11px; color:var(--rf-text-dim);
  }
  .grb-row{
    display:flex; align-items:center; gap:10px;
    padding:8px 0;
    border-bottom:1px solid var(--rf-border);
    font-size:13px;
  }
  .grb-row:last-child{ border-bottom:0; }
  .grb-row .grb-ico{
    width:18px; height:18px;
    display:flex; align-items:center; justify-content:center;
  }
  .grb-row.pass .grb-ico{ color:var(--rf-green); }
  .grb-row.warn .grb-ico{ color:var(--rf-amber); }
  .grb-row.fail .grb-ico{ color:var(--rf-red); }
  .grb-row .grb-text{ flex:1; }
  .grb-row .grb-text small{
    display:block; color:var(--rf-text-dim); font-size:11px; margin-top:1px;
  }

  /* small toast */
  .toast{
    background:var(--rf-bg-card-2);
    border:1px solid var(--rf-border-2);
    border-left:3px solid var(--rf-green);
    border-radius:9px;
    padding:11px 14px;
    display:flex; align-items:center; gap:10px;
    box-shadow:var(--rf-shadow-md);
    width:fit-content;
    margin-bottom:14px;
  }
  .toast.purple{ border-left-color:var(--rf-purple); }
  .toast.amber { border-left-color:var(--rf-amber); }
  .toast.red   { border-left-color:var(--rf-red); }
  .toast .t-ico{ color:var(--rf-green); }
  .toast.purple .t-ico{ color:var(--rf-purple); }
  .toast.amber .t-ico{ color:var(--rf-amber); }
  .toast.red .t-ico{ color:var(--rf-red); }
  .toast .t-txt{ font-size:13px; color:var(--rf-text); }

  /* CMS-aware banner */
  .cms-banner{
    background:linear-gradient(180deg, rgba(186,36,213,0.08) 0%, rgba(186,36,213,0.02) 100%);
    border:1px solid var(--rf-purple-line);
    border-radius:11px;
    padding:14px 18px;
    margin-bottom:16px;
    display:flex; align-items:center; gap:14px;
  }
  .cms-banner-ico{
    width:36px; height:36px;
    border-radius:9px;
    background:var(--rf-purple-soft);
    display:flex; align-items:center; justify-content:center;
    color:var(--rf-purple);
    flex:0 0 auto;
  }
  .cms-banner-text{ flex:1; }
  .cms-banner-text strong{
    display:block; font-size:13.5px; color:var(--rf-text);
    margin-bottom:2px;
  }
  .cms-banner-text span{
    font-size:12px; color:var(--rf-text-muted);
  }

  /* page-aware schema detection grid */
  .detect-grid{
    display:grid;
    grid-template-columns:repeat(3, 1fr);
    gap:8px;
    margin-top:8px;
  }
  .detect-pill{
    display:flex; align-items:center; gap:6px;
    background:var(--rf-bg-card);
    border:1px solid var(--rf-border);
    border-radius:8px;
    padding:8px 10px;
    font-size:11.5px;
    color:var(--rf-text-muted);
  }
  .detect-pill .ico{ color:var(--rf-green); flex:0 0 auto; }
  .detect-pill.missing .ico{ color:var(--rf-text-dim); }
  .detect-pill.missing{ color:var(--rf-text-dim); }

  /* CTA strip */
  .cta-strip{
    background:linear-gradient(180deg, rgba(186,36,213,0.12) 0%, rgba(186,36,213,0.04) 100%);
    border:1px solid var(--rf-purple-line);
    border-radius:11px;
    padding:14px 18px;
    display:flex; align-items:center; gap:14px;
  }
  .cta-strip strong{ font-size:13px; color:var(--rf-text); display:block; }
  .cta-strip small{ font-size:11.5px; color:var(--rf-text-muted); }
  .cta-strip-btn{
    margin-left:auto;
    background:linear-gradient(180deg, var(--rf-purple-btn-2), var(--rf-purple-btn));
    color:#fff;
    border:0;
    padding:8px 14px;
    border-radius:7px;
    font-size:12.5px; font-weight:600;
    cursor:pointer;
  }

  /* ============================================================
     POLISH PASS — Accessibility, contrast, focus, motion
     Added in v3 polish. Overrides earlier rules via cascade.
     ============================================================ */
     Added in v3 polish. Overrides earlier rules via cascade.
     ============================================================ */

  /* A11Y: Bump the failing contrast colors so all text passes WCAG AA */
  :root{
    --rf-text-faint: #7A8290;  /* was #4B5563 (2.8:1) → now 5.4:1 on #0E1012 */
    --rf-text-dim:   #8A91A0;  /* was #6B7280 (4.4:1) → now 5.8:1 on #0E1012 */

    /* Standardize radii — one of: 6 (small), 8 (med), 12 (large), 999 (pill) */
    --rf-radius-sm: 6px;
    --rf-radius-md: 8px;
    --rf-radius-lg: 12px;
    --rf-radius-pill: 999px;

    /* Focus ring — used everywhere for keyboard nav */
    --rf-focus: 0 0 0 2px var(--rf-bg), 0 0 0 4px var(--rf-purple);
  }

  /* A11Y: Bump minimum font sizes — anything labelled at 9-10px goes to 11px minimum */
  .proto-tag,
  .badge-new,
  .src-tag,
  .suggest-tag,
  .lib-row-status,
  .page-row-pill,
  .cs-tile-num,
  .proto-anno h3,
  .form-section-head,
  .grb-head small,
  .lib-row-sub,
  .page-row-meta .url,
  .editor-tabs .ext-badge,
  .field .err,
  .field .ok,
  .field .char-count,
  .field .hint,
  .field label .hint {
    font-size: 11px !important;
  }

  /* A11Y: Focus-visible outlines for all interactive elements */
  a:focus-visible,
  button:focus-visible,
  [role="button"]:focus-visible,
  [tabindex]:focus-visible,
  input:focus-visible,
  textarea:focus-visible,
  select:focus-visible,
  .sub-nav-item:focus-visible,
  .lib-row:focus-visible,
  .page-row:focus-visible,
  .suggest-card:focus-visible,
  .schema-action-btn:focus-visible,
  .btn-primary:focus-visible,
  .btn-secondary:focus-visible,
  .btn-inject:focus-visible,
  .btn-generate:focus-visible {
    outline: none;
    box-shadow: var(--rf-focus);
  }

  /* A11Y: Interactive elements that look clickable should be keyboard-reachable */
  .lib-row[role="button"],
  .page-row[role="button"],
  .suggest-card[role="button"],
  .schema-action-btn[role="button"],
  .sub-nav-item[role="button"] {
    cursor: pointer;
  }

  /* A11Y: Reduced motion support */
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.01ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.01ms !important;
    }
    .spinner {
      animation: none !important;
      border-top-color: var(--rf-purple);
    }
  }

  /* A11Y: Status pills now carry an icon so they don't rely on color alone.
     Existing .dot-st becomes a glyph slot. Override with new shapes. */
  .lib-row-status .dot-st,
  .page-row-pill .dot-st {
    width: 12px;
    height: 12px;
    background: transparent;
    border-radius: 0;
    position: relative;
    display: inline-flex;
    align-items: center;
    justify-content: center;
  }
  .lib-row-status.verified .dot-st::before { content: "✓"; font-size: 11px; font-weight: 700; color: currentColor; }
  .lib-row-status.pending .dot-st::before  { content: "◔"; font-size: 13px; line-height: 0.8; color: currentColor; }
  .lib-row-status.failed .dot-st::before   { content: "✕"; font-size: 11px; font-weight: 700; color: currentColor; }
  /* warning variant for amber statuses */
  .lib-row-status.warning {
    background: rgba(245,185,25,0.10);
    border-color: rgba(245,185,25,0.30);
    color: var(--rf-amber);
  }
  .lib-row-status.warning .dot-st::before { content: "!"; font-size: 11px; font-weight: 700; color: currentColor; }

  .page-row-pill.green .dot-st::before,
  .page-row-pill .dot-st::before { content: "•"; font-size: 14px; line-height: 0.8; color: currentColor; }
  .page-row-pill.amber .dot-st::before { content: "!"; font-size: 11px; font-weight: 700; }
  .page-row-pill.gray .dot-st::before { content: "○"; font-size: 11px; line-height: 0.8; }

  /* UX: Higher-contrast info banners — body text stays var(--rf-text), only the eyebrow/icon uses semantic color */
  .info-banner { color: var(--rf-text); }
  .info-banner strong { color: var(--rf-text); }

  /* UX: Recommendation tag visual weight — Recommended should feel obviously primary vs Optional */
  .suggest-tag {
    padding: 3px 9px;
    border: 1px solid;
    background: rgba(74,222,128,0.14);
    color: var(--rf-green);
    border-color: rgba(74,222,128,0.40);
  }
  .suggest-tag.optional {
    background: rgba(255,255,255,0.04);
    color: var(--rf-text-muted);
    border-color: var(--rf-border-2);
  }
  /* Lift Recommended cards subtly */
  .suggest-card.selected {
    box-shadow: 0 0 0 1px var(--rf-purple-line), 0 6px 18px rgba(186,36,213,0.06);
  }

  /* UX: Sub-nav icon differentiation — color tint for Schema vs LLM SEO so they read as different features */
  .sub-nav-item .ico { color: var(--rf-text-muted); }
  .sub-nav-item.active .ico { color: var(--rf-purple); }

  /* UX: Standardize all border-radius values — gentle pass that doesn't break too much */
  .schema-action-btn,
  .lib-btn,
  .btn-secondary,
  .btn-primary,
  .btn-inject,
  .btn-generate,
  .btn-test-google,
  .page-search,
  .json-copy { border-radius: var(--rf-radius-md) !important; }

  .lib-row,
  .page-row,
  .suggest-card,
  .editor-card,
  .json-card,
  .validation-panel,
  .google-result-box,
  .info-banner,
  .cms-banner,
  .cta-strip,
  .empty-state,
  .key-card,
  .sub-card,
  .picker-card,
  .page-picker-row { border-radius: var(--rf-radius-lg) !important; }

  /* UX: Stronger CTA for "Scan all pages" — promote from text link to card */
  .scan-all-cta {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 16px;
    background: rgba(186,36,213,0.05);
    border: 1px solid var(--rf-purple-line);
    border-radius: var(--rf-radius-lg);
    margin-bottom: 24px;
    cursor: pointer;
    transition: background 120ms;
  }
  .scan-all-cta:hover {
    background: rgba(186,36,213,0.10);
  }
  .scan-all-cta-ico {
    width: 32px; height: 32px;
    border-radius: var(--rf-radius-md);
    background: rgba(186,36,213,0.12);
    color: var(--rf-purple);
    display: flex;
    align-items: center;
    justify-content: center;
    flex: 0 0 auto;
  }
  .scan-all-cta-text {
    flex: 1;
  }
  .scan-all-cta-text strong {
    display: block;
    font-size: 13px;
    font-weight: 600;
    color: var(--rf-text);
  }
  .scan-all-cta-text span {
    display: block;
    font-size: 11.5px;
    color: var(--rf-text-muted);
    margin-top: 1px;
  }
  .scan-all-cta-arrow {
    color: var(--rf-purple);
    font-size: 14px;
    flex: 0 0 auto;
  }

  /* UX: Validation specificity — make the "will pass Google" badge informative */
  .validation-pill-detail {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 10.5px;
    font-weight: 600;
    letter-spacing: 0.3px;
    padding: 4px 10px;
    border-radius: var(--rf-radius-pill);
    background: rgba(74,222,128,0.12);
    color: var(--rf-green);
    border: 1px solid rgba(74,222,128,0.30);
  }
  .validation-pill-detail .check {
    width: 11px; height: 11px;
    display: inline-flex; align-items: center; justify-content: center;
  }

  /* UX: Field source tags — improve readability */
  .field-source-tag {
    font-size: 10.5px;
    color: var(--rf-text-muted);
    background: rgba(255,255,255,0.03);
    padding: 2px 7px;
    border-radius: var(--rf-radius-sm);
    white-space: nowrap;
  }
  .field-source-tag.fallback {
    color: var(--rf-purple);
    background: rgba(186,36,213,0.08);
  }
  .field-source-tag.cms {
    color: var(--rf-purple);
    background: rgba(186,36,213,0.08);
  }

  /* UX: Scan tree — schema badges inside collapsed rows */
  .scan-row-schemas {
    display: inline-flex;
    flex-wrap: wrap;
    gap: 4px;
    margin-top: 4px;
  }
  .scan-row-schema {
    font-size: 10.5px;
    font-weight: 500;
    padding: 2px 7px;
    border-radius: var(--rf-radius-sm);
    background: rgba(186,36,213,0.10);
    color: var(--rf-purple);
    white-space: nowrap;
  }
  .scan-row-schema.opt {
    background: rgba(255,255,255,0.04);
    color: var(--rf-text-muted);
  }

  /* UX: Keyboard-skip link for screen readers + keyboard users */
  .skip-link {
    position: absolute;
    top: -100px;
    left: 16px;
    background: var(--rf-purple);
    color: #fff;
    padding: 10px 16px;
    border-radius: var(--rf-radius-md);
    text-decoration: none;
    font-weight: 600;
    z-index: 9999;
    transition: top 120ms;
  }
  .skip-link:focus {
    top: 16px;
  }

  /* UX: Improve the dimmed/locked card pattern so it's clearer */
  .suggest-card .suggest-checkbox[aria-disabled="true"],
  .suggest-checkbox[style*="opacity"] {
    background: rgba(255,255,255,0.02);
    border: 1.5px dashed var(--rf-border-strong);
  }


  /* ============================================================
     V4 — Tab system + Library page-rows + Settings + Verification
     ============================================================ */

  /* ---- Feature tabs (Generate / Library / Verification / Settings) ---- */
  .feature-tabs{
    display:flex;
    align-items:center;
    gap:0;
    border-bottom:1px solid var(--rf-border);
    margin: -4px -28px 22px;
    padding: 0 28px;
    position:relative;
  }
  .feature-tab{
    position:relative;
    padding:12px 4px 13px;
    margin-right:24px;
    color:var(--rf-text-muted);
    font-size:14px;
    font-weight:500;
    cursor:pointer;
    background:none;
    border:0;
    font-family:inherit;
    display:inline-flex;
    align-items:center;
    gap:8px;
  }
  .feature-tab:hover{ color:var(--rf-text-2); }
  .feature-tab.active{
    color:var(--rf-purple);
    font-weight:600;
  }
  .feature-tab.active::after{
    content:"";
    position:absolute;
    left:0; right:0;
    bottom:-1px;
    height:2px;
    background:var(--rf-purple);
    border-radius:2px 2px 0 0;
  }
  .feature-tab .ft-count{
    font-size:11px;
    font-weight:500;
    color:var(--rf-text-dim);
    background:rgba(255,255,255,0.04);
    border-radius:var(--rf-radius-pill);
    padding:1px 7px;
    line-height:1.55;
  }
  .feature-tab.active .ft-count{
    background:var(--rf-purple-soft);
    color:var(--rf-purple);
  }
  .feature-tab .ft-dot{
    width:6px; height:6px;
    border-radius:50%;
    background:var(--rf-amber);
    margin-left:2px;
    flex:0 0 6px;
  }

  /* ---- Library page-row ---- */
  .lib-page{
    background:var(--rf-bg-card);
    border:1px solid var(--rf-border);
    border-radius:var(--rf-radius-lg);
    margin-bottom:10px;
    overflow:hidden;
    transition:border-color 120ms;
  }
  .lib-page:hover{ border-color:var(--rf-border-strong); }
  .lib-page.expanded{ border-color:var(--rf-purple-line); }

  .lib-page-head{
    display:grid;
    grid-template-columns:auto 32px 1fr auto auto;
    gap:12px;
    align-items:center;
    padding:14px 16px;
    cursor:pointer;
    background:none;
    border:0;
    width:100%;
    text-align:left;
    font-family:inherit;
    color:inherit;
  }
  .lib-page-head:focus-visible{
    outline:none;
    box-shadow:inset 0 0 0 2px var(--rf-purple);
  }
  .lib-page.expanded .lib-page-head{
    background:rgba(186,36,213,0.04);
    border-bottom:1px solid var(--rf-border);
  }
  .lib-page-caret{
    width:16px; height:16px;
    color:var(--rf-text-muted);
    transition:transform 150ms;
    display:flex; align-items:center; justify-content:center;
  }
  .lib-page.expanded .lib-page-caret{ transform:rotate(90deg); color:var(--rf-purple); }
  .lib-page-ico{
    width:32px; height:32px;
    border-radius:var(--rf-radius-md);
    background:var(--rf-bg-card-3);
    display:flex; align-items:center; justify-content:center;
    color:var(--rf-text-muted);
    flex:0 0 32px;
  }
  .lib-page-ico.home{ background:rgba(74,222,128,0.10); color:var(--rf-green); }
  .lib-page-ico.article{ background:rgba(59,130,246,0.10); color:var(--rf-blue); }
  .lib-page-ico.product{ background:rgba(186,36,213,0.10); color:var(--rf-purple); }
  .lib-page-ico.empty{ opacity:0.5; }
  .lib-page-meta{ min-width:0; }
  .lib-page-path{
    font-size:13.5px;
    font-weight:600;
    color:var(--rf-text);
    display:flex;
    align-items:center;
    gap:8px;
  }
  .lib-page-path .cms-pill{
    font-size:10.5px;
    font-weight:700;
    letter-spacing:0.3px;
    padding:2px 7px;
    border-radius:var(--rf-radius-sm);
    background:rgba(186,36,213,0.20);
    color:var(--rf-purple);
  }
  .lib-page-summary{
    font-size:12px;
    color:var(--rf-text-muted);
    margin-top:3px;
  }
  .lib-page-summary .verified{ color:var(--rf-green); }
  .lib-page-summary .warning{ color:var(--rf-amber); }
  .lib-page-summary .pending{ color:var(--rf-text-muted); }
  .lib-page-badges{

    gap:4px;

  .lib-page-badge{
    font-size:10.5px;

    color:var(--rf-purple);

  .lib-page-badge.llmseo{
    background:rgba(20,184,166,0.18);
    color:var(--rf-teal);
  }
  .lib-page-status-pill{
    display:inline-flex;
    align-items:center;
    gap:6px;
    font-size:11px;
    font-weight:600;
    padding:4px 10px;
    border-radius:var(--rf-radius-pill);

  .lib-page-status-pill.verified{
    background:rgba(74,222,128,0.10);

    color:var(--rf-green);
  }
  .lib-page-status-pill.warning{
    background:rgba(245,185,25,0.10);

  .lib-page-status-pill.pending{

  }
  .lib-page-status-pill.empty{
    background:rgba(255,255,255,0.02);
    border-color:var(--rf-border);
    color:var(--rf-text-dim);

  /* Expanded body — individual schema rows */
  .lib-page-body{
    padding:8px 16px 14px 60px;
  }
  .lib-schema-row{
    display:grid;
    grid-template-columns: 1fr auto auto auto;
    gap:14px;
    align-items:center;
    padding:9px 12px;
    border-radius:var(--rf-radius-md);
    background:transparent;
  }
  .lib-schema-row:hover{ background:rgba(255,255,255,0.025); }
  .lib-schema-row + .lib-schema-row{ margin-top:2px; }
  .lib-schema-name{
    font-size:13px;
    font-weight:500;
    color:var(--rf-text);
    display:flex;
    align-items:center;
    gap:8px;
  }
  .lib-schema-source-tag{
    font-size:10px;
    font-weight:700;
    letter-spacing:0.4px;
    text-transform:uppercase;
    padding:2px 6px;
    border-radius:var(--rf-radius-sm);
  }
  .lib-schema-source-tag.auto{
    background:rgba(186,36,213,0.15);
    color:var(--rf-purple);
  }
  .lib-schema-source-tag.llmseo{
    background:rgba(20,184,166,0.18);
    color:var(--rf-teal);
  }
  .lib-schema-status{
    display:inline-flex;
    align-items:center;
    gap:5px;
    font-size:11px;
    color:var(--rf-text-muted);
  }
  .lib-schema-status.verified{ color:var(--rf-green); }
  .lib-schema-status.warning{ color:var(--rf-amber); }
  .lib-schema-status.pending{ color:var(--rf-text-muted); }
  .lib-schema-status.failed{ color:var(--rf-red); }
  .lib-schema-when{
    font-size:11px;
    color:var(--rf-text-dim);
    white-space:nowrap;
  }
  .lib-schema-actions{
    display:flex;
    gap:2px;
  }
  .lib-schema-action{
    width:26px; height:26px;
    display:flex; align-items:center; justify-content:center;
    background:transparent;
    border:0;
    color:var(--rf-text-muted);
    border-radius:var(--rf-radius-sm);
    cursor:pointer;
  }
  .lib-schema-action:hover{
    background:rgba(255,255,255,0.05);
    color:var(--rf-text);
  }

  /* ---- Verification list ---- */
  .verif-controls{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    margin-bottom:14px;
  }
  .verif-sort{
    display:flex;
    gap:6px;
  }
  .verif-sort-btn{
    padding:5px 11px;
    background:rgba(255,255,255,0.04);
    border:1px solid var(--rf-border-2);
    border-radius:var(--rf-radius-md);
    color:var(--rf-text-muted);
    font-size:11.5px;
    cursor:pointer;
    font-family:inherit;
  }
  .verif-sort-btn.active{
    background:var(--rf-purple-soft);
    border-color:var(--rf-purple-line);
    color:var(--rf-purple);
  }

  .verif-row{
    display:grid;
    grid-template-columns:24px auto 1fr auto auto auto;
    gap:14px;
    align-items:center;
    padding:13px 16px;
    background:var(--rf-bg-card);
    border:1px solid var(--rf-border);
    border-radius:var(--rf-radius-lg);
    margin-bottom:8px;
  }
  .verif-row.failed{ border-left:3px solid var(--rf-red); padding-left:13px; }
  .verif-row.warning{ border-left:3px solid var(--rf-amber); padding-left:13px; }
  .verif-row.verified{ border-left:3px solid var(--rf-green); padding-left:13px; }
  .verif-row-glyph{
    width:22px; height:22px;
    border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    font-size:12px; font-weight:700;
  }
  .verif-row.failed .verif-row-glyph{
    background:var(--rf-red-soft);
    color:var(--rf-red);
  }
  .verif-row.warning .verif-row-glyph{
    background:var(--rf-amber-soft);
    color:var(--rf-amber);
  }
  .verif-row.verified .verif-row-glyph{
    background:var(--rf-green-soft);
    color:var(--rf-green);
  }
  .verif-row-type{
    font-size:13px;
    font-weight:600;
  }
  .verif-row-page{
    font-size:11.5px;
    color:var(--rf-text-muted);
    margin-top:2px;
    font-family:'JetBrains Mono', monospace;
  }
  .verif-row-issue{
    font-size:11.5px;
    color:var(--rf-text-muted);
  }
  .verif-row.failed .verif-row-issue{ color:var(--rf-red); }
  .verif-row.warning .verif-row-issue{ color:var(--rf-amber); }
  .verif-row-when{
    font-size:11px;
    color:var(--rf-text-dim);
    white-space:nowrap;
  }
  .verif-row-fix-btn{
    background:var(--rf-purple-soft);
    color:var(--rf-purple);
    border:1px solid var(--rf-purple-line);
    padding:5px 10px;
    border-radius:var(--rf-radius-md);
    font-size:11.5px;
    font-weight:600;
    cursor:pointer;
    font-family:inherit;
  }

  /* ---- Settings tab ---- */
  .settings-section{
    background:var(--rf-bg-card);
    border:1px solid var(--rf-border);
    border-radius:var(--rf-radius-lg);
    padding:18px 20px;
    margin-bottom:14px;
  }
  .settings-section-title{
    font-size:13px;
    font-weight:700;
    letter-spacing:0.5px;
    text-transform:uppercase;
    color:var(--rf-text-dim);
    margin:0 0 14px;
    display:flex; align-items:center; gap:8px;
  }
  .settings-row{
    display:grid;
    grid-template-columns:1fr auto;
    gap:14px;
    align-items:center;
    padding:10px 0;
    border-bottom:1px solid var(--rf-border);
  }
  .settings-row:last-child{ border-bottom:0; }
  .settings-row-text strong{
    display:block;
    font-size:13.5px;
    font-weight:600;
    color:var(--rf-text);
  }
  .settings-row-text span{
    display:block;
    font-size:12px;
    color:var(--rf-text-muted);
    margin-top:3px;
    line-height:1.5;
  }
  .settings-row-control{
    flex:0 0 auto;
  }
  .settings-radio-group{
    display:flex;
    gap:6px;
  }
  .settings-radio{
    padding:6px 12px;
    background:rgba(255,255,255,0.04);
    border:1px solid var(--rf-border-2);
    border-radius:var(--rf-radius-md);
    color:var(--rf-text-muted);
    font-size:11.5px;
    cursor:pointer;
    font-family:inherit;
  }
  .settings-radio.active{
    background:var(--rf-purple-soft);
    border-color:var(--rf-purple-line);
    color:var(--rf-purple);
    font-weight:600;
  }
  .settings-danger{
    background:rgba(221,82,76,0.04);
    border-color:rgba(221,82,76,0.25);
  }
  .settings-danger .settings-section-title{
    color:var(--rf-red);
  }
  .danger-btn{
    background:rgba(221,82,76,0.10);
    border:1px solid rgba(221,82,76,0.35);
    color:var(--rf-red);
    padding:7px 14px;
    border-radius:var(--rf-radius-md);
    font-size:12px;
    font-weight:600;
    cursor:pointer;
    font-family:inherit;
  }

  /* Recent activity card on Generate tab */
  .recent-activity{
    background:var(--rf-bg-card);
    border:1px solid var(--rf-border);
    border-radius:var(--rf-radius-lg);
    padding:14px 16px;
    margin-bottom:14px;
  }
  .recent-activity-title{
    font-size:11px;
    font-weight:700;
    letter-spacing:0.5px;
    text-transform:uppercase;
    color:var(--rf-text-dim);
    margin:0 0 10px;
    display:flex; align-items:center; gap:6px;
  }
  .recent-activity-row{
    display:flex;
    align-items:center;
    gap:10px;
    padding:8px 0;
    border-top:1px solid var(--rf-border);
    font-size:12.5px;
  }
  .recent-activity-row:first-of-type{ border-top:0; }
  .recent-activity-row .ra-ico{
    width:20px; height:20px;
    color:var(--rf-green);
    flex:0 0 20px;
  }
  .recent-activity-row .ra-text{
    flex:1;
    color:var(--rf-text-2);
  }
  .recent-activity-row .ra-when{
    color:var(--rf-text-dim);
    font-size:11px;
    white-space:nowrap;
  }

  /* ============================================================
     V5 — Density fixes, stepper, what-needs-attention, all-clear,
          CMS coverage detail, uncovered-pages banner, keyboard hint
     ============================================================ */

  /* ---- Stepper for per-page Auto-Generate sub-flow ---- */
  .stepper{
    display:flex;
    align-items:center;
    gap:8px;
    padding:12px 16px;
    background:var(--rf-bg-card);
    border:1px solid var(--rf-border);
    border-radius:var(--rf-radius-lg);
    margin-bottom:18px;
  }
  .stepper-step{
    display:flex;
    align-items:center;
    gap:8px;
    font-size:11.5px;
    color:var(--rf-text-muted);
    font-weight:500;
  }
  .stepper-step .step-num{
    width:22px; height:22px;
    border-radius:50%;
    background:rgba(255,255,255,0.04);
    border:1px solid var(--rf-border-2);
    display:flex; align-items:center; justify-content:center;
    font-size:11px; font-weight:600;
    color:var(--rf-text-muted);
    flex:0 0 22px;
  }
  .stepper-step.done .step-num{
    background:var(--rf-green-soft);
    border-color:rgba(74,222,128,0.30);
    color:var(--rf-green);
  }
  .stepper-step.active{
    color:var(--rf-text);
  }
  .stepper-step.active .step-num{
    background:var(--rf-purple-soft);
    border-color:var(--rf-purple-line);
    color:var(--rf-purple);
    font-weight:700;
    box-shadow:0 0 0 3px rgba(186,36,213,0.10);
  }
  .stepper-step.active .step-label{
    color:var(--rf-text);
    font-weight:600;
  }
  .stepper-divider{
    flex:1;
    height:1px;
    background:var(--rf-border-2);
    min-width:8px;
  }
  .stepper-step.done + .stepper-divider{
    background:rgba(74,222,128,0.30);
  }

  /* ---- What-needs-attention card on Generate tab ---- */
  .needs-attention{
    background:var(--rf-bg-card);
    border:1px solid var(--rf-border);
    border-radius:var(--rf-radius-lg);
    overflow:hidden;
    margin-bottom:14px;
  }
  .needs-attention-head{
    padding:13px 16px;
    background:rgba(186,36,213,0.04);
    border-bottom:1px solid var(--rf-border);
    display:flex; align-items:center; gap:8px;
    font-size:11.5px;
    font-weight:700;
    letter-spacing:0.4px;
    text-transform:uppercase;
    color:var(--rf-purple);
  }
  .needs-attention-head.empty{
    background:rgba(74,222,128,0.04);
    color:var(--rf-green);
  }
  .needs-attention-row{
    padding:11px 16px;
    display:grid;
    grid-template-columns:auto 1fr auto;
    gap:12px;
    align-items:center;
    border-top:1px solid var(--rf-border);
  }
  .needs-attention-row:first-of-type{ border-top:0; }
  .needs-attention-ico{
    width:28px; height:28px;
    border-radius:var(--rf-radius-md);
    display:flex; align-items:center; justify-content:center;
    flex:0 0 28px;
  }
  .needs-attention-ico.failed{ background:var(--rf-red-soft); color:var(--rf-red); }
  .needs-attention-ico.warning{ background:var(--rf-amber-soft); color:var(--rf-amber); }
  .needs-attention-ico.pending{ background:var(--rf-purple-soft); color:var(--rf-purple); }
  .needs-attention-ico.uncovered{ background:rgba(255,255,255,0.04); color:var(--rf-text-muted); }
  .needs-attention-text{
    font-size:12.5px;
    color:var(--rf-text-2);
    line-height:1.4;
  }
  .needs-attention-text strong{ color:var(--rf-text); }
  .needs-attention-action{
    background:rgba(186,36,213,0.10);
    color:var(--rf-purple);
    border:1px solid var(--rf-purple-line);
    padding:5px 11px;
    border-radius:var(--rf-radius-md);
    font-size:11.5px;
    font-weight:600;
    cursor:pointer;
    font-family:inherit;
    white-space:nowrap;
  }

  /* ---- Verification all-clear state ---- */
  .verif-allclear{
    background:linear-gradient(180deg, rgba(74,222,128,0.04) 0%, rgba(74,222,128,0.01) 100%);
    border:1px solid rgba(74,222,128,0.25);
    border-radius:var(--rf-radius-lg);
    padding:30px 24px;
    text-align:center;
    margin-bottom:16px;
  }
  .verif-allclear-ico{
    width:64px; height:64px;
    border-radius:50%;
    background:rgba(74,222,128,0.10);
    color:var(--rf-green);
    display:inline-flex; align-items:center; justify-content:center;
    margin-bottom:14px;
  }
  .verif-allclear-ico svg{ width:32px; height:32px; }
  .verif-allclear h3{
    font-size:18px;
    font-weight:600;
    margin:0 0 6px;
    color:var(--rf-text);
  }
  .verif-allclear p{
    font-size:13px;
    color:var(--rf-text-muted);
    margin:0 0 18px;
    line-height:1.5;
  }
  .verif-allclear-meta{
    display:flex;
    justify-content:center;
    gap:24px;
    font-size:11.5px;
    color:var(--rf-text-muted);
    padding-top:14px;
    border-top:1px solid rgba(74,222,128,0.15);
  }
  .verif-allclear-meta strong{
    color:var(--rf-text);
    display:block;
    font-size:13px;
    font-weight:600;
    margin-top:2px;
  }

  /* ---- CMS coverage detail (in Library expanded view) ---- */
  .cms-coverage-card{
    background:rgba(186,36,213,0.03);
    border:1px solid var(--rf-purple-line);
    border-radius:var(--rf-radius-md);
    padding:12px 14px;
    margin-bottom:8px;
  }
  .cms-coverage-head{
    display:flex;
    align-items:center;
    gap:8px;
    margin-bottom:10px;
    font-size:11.5px;
    color:var(--rf-text-2);
  }
  .cms-coverage-bar{
    height:6px;
    background:rgba(255,255,255,0.04);
    border-radius:99px;
    overflow:hidden;
    display:flex;
    margin-bottom:8px;
  }
  .cms-coverage-fill{
    height:100%;
    transition:width 200ms;
  }
  .cms-coverage-fill.verified{ background:var(--rf-green); }
  .cms-coverage-fill.pending{ background:var(--rf-purple); }
  .cms-coverage-fill.failed{ background:var(--rf-red); }
  .cms-coverage-legend{
    display:flex;
    gap:14px;
    font-size:10.5px;
    color:var(--rf-text-muted);
    flex-wrap:wrap;
  }
  .cms-coverage-legend-item{
    display:inline-flex;
    align-items:center;
    gap:5px;
  }
  .cms-coverage-legend-dot{
    width:8px; height:8px;
    border-radius:50%;
    flex:0 0 8px;
  }

  /* ---- Uncovered pages banner (prominent, top of Library) ---- */
  .uncovered-banner{
    background:rgba(245,185,25,0.06);
    border:1px solid rgba(245,185,25,0.25);
    border-radius:var(--rf-radius-lg);
    padding:14px 16px;
    margin-bottom:14px;
    display:grid;
    grid-template-columns:auto 1fr auto;
    gap:14px;
    align-items:center;
  }
  .uncovered-banner-ico{
    width:32px; height:32px;
    border-radius:var(--rf-radius-md);
    background:rgba(245,185,25,0.12);
    color:var(--rf-amber);
    display:flex; align-items:center; justify-content:center;
    flex:0 0 32px;
  }
  .uncovered-banner-text strong{
    display:block;
    font-size:13px;
    font-weight:600;
    color:var(--rf-text);
  }
  .uncovered-banner-text span{
    display:block;
    font-size:11.5px;
    color:var(--rf-text-muted);
    margin-top:2px;
    line-height:1.5;
  }
  .uncovered-banner-cta{
    background:var(--rf-amber);
    color:#1A1D24;
    border:0;
    padding:7px 14px;
    border-radius:var(--rf-radius-md);
    font-size:12px;
    font-weight:600;
    cursor:pointer;
    font-family:inherit;
    white-space:nowrap;
  }

  /* ---- Cleaner Library row (v5 - remove duplicate status) ---- */
  .lib-page-head.v5{
    grid-template-columns:auto 32px 1fr auto;
  }
  .lib-page-summary-v5{
    font-size:12px;
    color:var(--rf-text-muted);
  }

  /* ---- Search collapsed to icon button ---- */
  .lib-toolbar{
    display:flex;
    align-items:center;
    gap:8px;
    margin-bottom:14px;
  }
  .lib-search-trigger{
    width:36px; height:36px;
    background:rgba(255,255,255,0.04);
    border:1px solid var(--rf-border-2);
    border-radius:var(--rf-radius-md);
    color:var(--rf-text-muted);
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
    flex:0 0 36px;
  }
  .lib-search-trigger:hover{ color:var(--rf-text); }
  .lib-filter-pills{
    display:flex;
    gap:4px;
    background:rgba(255,255,255,0.02);
    border:1px solid var(--rf-border-2);
    border-radius:var(--rf-radius-md);
    padding:2px;
  }
  .lib-filter-pills .settings-radio{
    background:transparent;
    border:0;
    padding:5px 11px;
  }
  .lib-filter-pills .settings-radio.active{
    background:var(--rf-purple-soft);
    border:1px solid var(--rf-purple-line);
  }

  /* ---- First-run illustration (before/after Google search) ---- */
  .first-run-illust{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
    margin:20px 0 24px;
  }
  .first-run-card{
    background:var(--rf-bg-card);
    border:1px solid var(--rf-border);
    border-radius:var(--rf-radius-md);
    padding:14px;
    position:relative;
  }
  .first-run-card-label{
    position:absolute;
    top:-9px; left:12px;
    background:var(--rf-bg);
    padding:0 8px;
    font-size:10px;
    font-weight:700;
    letter-spacing:0.5px;
    text-transform:uppercase;
    color:var(--rf-text-dim);
  }
  .first-run-card.after .first-run-card-label{
    color:var(--rf-purple);
  }
  .frc-result{
    font-size:12px;
    color:var(--rf-text-2);
  }
  .frc-result-title{
    font-size:13px;
    color:var(--rf-blue);
    font-weight:500;
    margin-bottom:2px;
  }
  .frc-result-url{
    font-size:10.5px;
    color:var(--rf-green);
    margin-bottom:6px;
  }
  .frc-result-snippet{
    font-size:11px;
    color:var(--rf-text-muted);
    line-height:1.4;
  }
  .frc-result-rich{
    display:flex;
    gap:8px;
    margin-top:8px;
    align-items:center;
  }
  .frc-stars{
    color:var(--rf-amber);
    font-size:11px;
  }
  .frc-img{
    width:36px; height:36px;
    border-radius:4px;
    background:linear-gradient(135deg, var(--rf-purple) 0%, var(--rf-blue) 100%);
  }
  .frc-faq{
    margin-top:6px;
    padding:6px 8px;
    background:rgba(255,255,255,0.03);
    border-radius:4px;
    font-size:10.5px;
    color:var(--rf-text-muted);
    display:flex; align-items:center; gap:5px;
  }

  /* ---- Keyboard shortcut hints in tab labels ---- */
  .feature-tab .kbd{
    display:none;
    font-size:9.5px;
    font-family:'JetBrains Mono', monospace;
    color:var(--rf-text-dim);
    background:rgba(255,255,255,0.04);
    padding:1px 5px;
    border-radius:3px;
    margin-left:2px;

   active group is expanded, which keeps the rail inside the
   short Framer plugin window (about 720px tall) no matter how
   many features ship.
   ============================================================ */
const PLUGIN_NAV_GROUPS = [
  { key:'setup',    label:'Setup',          icon:ico.cog,   items:[
    {k:'global',     label:'Global Settings'},
  ]},
  { key:'optimize', label:'Optimize',       icon:ico.zap,   items:[
    {k:'pages',      label:'Pages'},
    {k:'images',     label:'Image SEO'},
    {k:'schema',     label:'Schema',     isNew:true},
    {k:'llmseo',     label:'LLM SEO',    isNew:true},

  { key:'index',    label:'Index',          icon:ico.globe, items:[
    {k:'submit',     label:'Submit Indexing'},
    {k:'sitemap',    label:'Sitemap'},

    {k:'analyzer',   label:'SEO Analyzer'},
    {k:'keywords',   label:'Keyword Tracker'},
    {k:'speed',      label:'Page Speed'},
    {k:'monitor404', label:'404 Monitor'},
  ]},

    {k:'calendar',   label:'Calendar'},
    {k:'research',   label:'Research Hub'},
    {k:'drafts',     label:'Draft Queue'},
    {k:'links',      label:'Link Opportunities'},
    {k:'sync',       label:'Sync Status'},
  ]},
];

   canonical item keys without touching every screen. */

  globalSettings:'global', submitIndexing:'submit', seoAnalyzer:'analyzer',
  imageSEO:'images', researchHub:'research', draftQueue:'drafts',
  linkOpps:'links', syncStatus:'sync', advanced:'schema',
};
function pluginSubNav(activeKey){
  const key = PLUGIN_NAV_ALIASES[activeKey] || activeKey;
  const activeGroup = PLUGIN_NAV_GROUPS.find(g => g.items.some(it=>it.k===key));
  const agKey = activeGroup ? activeGroup.key : 'optimize';
  const chev = '<svg class="plg-acc-chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M9 6l6 6-6 6"/></svg>';
  const groupsHtml = PLUGIN_NAV_GROUPS.map(g=>{
    const open = g.key === agKey;
    return `
      <div class="plg-acc-group ${open?'open':''}">
        <button type="button" class="plg-acc-head ${open?'active-group':''}" aria-expanded="${open?'true':'false'}">
          <span class="plg-acc-ico">${g.icon}</span>
          <span class="plg-acc-label">${g.label}</span>
          ${g.isNew?'<span class="plg-acc-new">NEW</span>':''}

/* JSON syntax-color helper (light) */
function jsonHTML(obj, indent=0){
  if(typeof obj === 'string'){
    return `<span class="s">"${obj.replace(/"/g, '\\"')}"</span>`;
  }
  if(typeof obj === 'number'){ return `<span class="n">${obj}</span>`; }
  if(typeof obj === 'boolean'){ return `<span class="n">${obj}</span>`; }
  if(obj === null){ return `<span class="n">null</span>`; }
  const pad = '  '.repeat(indent);
  const padIn = '  '.repeat(indent+1);
  if(Array.isArray(obj)){
    if(obj.length===0) return `<span class="br">[]</span>`;
    return `<span class="br">[</span>\n${obj.map(v => padIn + jsonHTML(v, indent+1)).join(',\n')}\n${pad}<span class="br">]</span>`;
  }
  if(typeof obj === 'object'){
    const keys = Object.keys(obj);
    if(keys.length===0) return `<span class="br">{}</span>`;
    return `<span class="br">{</span>\n${keys.map(k => {
      return padIn + `<span class="k">"${k}"</span><span class="br">:</span> ${jsonHTML(obj[k], indent+1)}`;
    }).join(',\n')}\n${pad}<span class="br">}</span>`;
  }
  return String(obj);
}

function jsonScript(obj){
  return `&lt;script type="application/ld+json"&gt;\n${jsonHTML(obj)}\n&lt;/script&gt;`;
}

        <div style="padding:14px; background:rgba(186,36,213,0.06); border-radius:9px; border:1px solid var(--rf-purple-line);">

function buildSidebarNav(){
  const groups = [
    { title:'Generate · entry',     screenIds:['s2','s3'] },
    { title:'Generate · per-page',  screenIds:['s4','s5','s6','s7','s8','s9','s10','s11','s12'] },
    { title:'Generate · scan-all',  screenIds:['s13','s14','s15','s16'] },
    { title:'Library',              screenIds:['s17','s18','s19','s20'] },
    { title:'Verification',         screenIds:['s21','s22','s23'] },
    { title:'Settings',              screenIds:['s24'] },
    { title:'Edge & cross-feature', screenIds:['s25','s26'] },
  ];

  let html = `<a href="#s1" class="proto-nav-item active"><span class="num">00</span><span>Contact sheet</span></a>`;

  for (const g of groups) {
    html += `<div class="proto-nav-section-title" style="padding-top:14px;">${g.title}</div>`;
    for (const sid of g.screenIds) {
      const s = screens.find(x => x.id === sid);
      if (!s) continue;
      const num = sid.replace('s','').padStart(2, '0');
      const newCls = s.newScreen ? 'new-screen' : '';
      const shortTitle = s.title.length > 32 ? s.title.substring(0, 32) + '…' : s.title;
      html += `<a href="#${sid}" class="proto-nav-item ${newCls}"><span class="num">${num}</span><span>${shortTitle}</span></a>`;
    }
  }
  return html;
}

const root = document.getElementById('screens-root');
const nav = document.getElementById('proto-nav');

nav.innerHTML = buildSidebarNav();

root.innerHTML = screens.map(s => {
  let body = s.body;
  if (body === '__CONTACT_SHEET__') body = buildContactSheet();

  return `
    <section class="state-section" id="${s.id}">
      <div class="proto-screen-head">
        <span class="proto-tag ${s.newScreen?'new':''}">${s.newScreen?'NEW · ':''}${s.tag}</span>
        <h1>${s.title}</h1>
        ${s.desc ? `<p>${s.desc}</p>` : ''}
      </div>
      ${body}
      ${s.anno ? `
        <div class="proto-anno">
          <h3>Developer notes</h3>
          <div class="proto-anno-grid">
            ${s.anno.map(([k,v])=>`<div class="proto-anno-item"><dt>${k}</dt><dd>${v}</dd></div>`).join('')}
          </div>
        </div>
      ` : ''}
    </section>
  `;
}).join('');

/* Scroll spy */
if (typeof IntersectionObserver !== 'undefined') {
  const sideLinks = [...document.querySelectorAll('.proto-side .proto-nav-item')];
  const sections = [...document.querySelectorAll('.state-section')];
  const obs = new IntersectionObserver(entries=>{
    entries.forEach(e=>{
      if(e.isIntersecting){
        sideLinks.forEach(a=>a.classList.toggle('active', a.getAttribute('href') === '#' + e.target.id));
      }
    });
  }, {rootMargin:'-30% 0px -60% 0px'});
  sections.forEach(s=>obs.observe(s));
}

/* Accordion plugin nav: clicking a group header expands it and
   collapses its siblings, within whichever mock plugin window was
   clicked. Purely demonstrative so the pattern feels live. */
document.addEventListener('click', (e) => {
  const head = e.target.closest('.plg-acc-head');
  if (!head) return;
  const group = head.closest('.plg-acc-group');
  const nav = head.closest('.sub-nav');
  if (!group || !nav) return;
  const willOpen = !group.classList.contains('open');
  nav.querySelectorAll('.plg-acc-group').forEach(g => {
    g.classList.remove('open');
    const kids = g.querySelector('.plg-acc-children');
    const hd = g.querySelector('.plg-acc-head');
    if (kids) kids.hidden = true;
    if (hd) hd.setAttribute('aria-expanded', 'false');
  });
  if (willOpen) {
    group.classList.add('open');
    const kids = group.querySelector('.plg-acc-children');
    if (kids) kids.hidden = false;
    head.setAttribute('aria-expanded', 'true');
  }
});

/* v5: Keyboard shortcuts for Schema tab switching — Cmd/Ctrl + 1/2/3/4 */
document.addEventListener('keydown', (e) => {
  // Only fire on Cmd (Mac) or Ctrl (Windows/Linux) modifier
  if (!(e.metaKey || e.ctrlKey)) return;
  // Numeric keys 1-4
  const tabMap = { '1':'s3', '2':'s17', '3':'s22', '4':'s24' };
  const sid = tabMap[e.key];
  if (!sid) return;
  e.preventDefault();
  const el = document.getElementById(sid);
  if (el) el.scrollIntoView({ behavior:'smooth', block:'start' });
});

</script>

<script id="shell-script">
  var stage=document.getElementById("stage");
  var chooser=document.getElementById("chooser");
  var switchBtns=Array.prototype.slice.call(document.querySelectorAll(".vw-switch button"));
  var TPL={content:"tpl-content", multiuser:"tpl-multi", schema:"tpl-schema"};
  var current=null;
  function mount(target){
    if(current===target){ return; }
    if(!TPL[target]){ return; }
    stage.innerHTML="";
    var tpl=document.getElementById(TPL[target]);
    var node=tpl.content.cloneNode(true);
    stage.appendChild(node);
    // re-execute scripts (cloned scripts do not run); wrap each in an IIFE to keep top-level consts local
    Array.prototype.slice.call(stage.querySelectorAll("script")).forEach(function(old){
      var s=document.createElement("script");
      s.textContent="(function(){\n"+old.textContent+"\n})();";
      old.parentNode.replaceChild(s, old);
    });
    current=target;
    switchBtns.forEach(function(b){ b.classList.toggle("active", b.dataset.target===target); });
    document.body.classList.remove("rf-home"); document.body.classList.add("rf-app");
    chooser.classList.add("hidden");
    location.hash=target;
    window.scrollTo(0,0);
  }
  function goHome(){
    stage.innerHTML=""; current=null;
    document.body.classList.remove("rf-app"); document.body.classList.add("rf-home");
    chooser.classList.remove("hidden");
    location.hash="";
  }
  Array.prototype.slice.call(document.querySelectorAll(".ch-card")).forEach(function(c){ c.addEventListener("click", function(){ mount(c.dataset.target); }); });
  switchBtns.forEach(function(b){ b.addEventListener("click", function(){ mount(b.dataset.target); }); });
  document.getElementById("homeBtn").addEventListener("click", goHome);
  var initial=(location.hash||"").replace("#","");
  if(TPL[initial]){ mount(initial); }
</script>
</body>
