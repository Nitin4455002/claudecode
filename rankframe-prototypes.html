    --plugin-w:880px; --plugin-h:720px; --sub-nav-w:240px;
    --rf-radius-sm:6px; --rf-radius-md:8px; --rf-radius-lg:12px; --rf-radius-pill:999px;
    --rf-focus:0 0 0 2px var(--rf-bg), 0 0 0 4px var(--rf-purple);
  }
  *,*::before,*::after{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  body{
    font-family:'Inter',-apple-system,system-ui,sans-serif;
    background:#08090B; color:var(--rf-text); font-size:14px; line-height:1.5;
    -webkit-font-smoothing:antialiased; min-height:100vh;
    background-image:radial-gradient(circle at 20% 0%, rgba(186,36,213,0.05) 0%, transparent 40%),
      radial-gradient(circle at 80% 100%, rgba(186,36,213,0.04) 0%, transparent 40%);
    background-attachment:fixed;
  }
  code,.mono{ font-family:'JetBrains Mono',ui-monospace,Menlo,monospace; }

  /* ===== Outer prototype layout ===== */
  .proto-page{ display:grid; grid-template-columns:280px 1fr; min-height:100vh; }
  .proto-side{
    background:rgba(7,7,9,0.85); backdrop-filter:blur(20px);
    border-right:1px solid var(--rf-border); padding:24px 18px;
    position:sticky; top:0; height:100vh; overflow-y:auto;
  }
  .proto-side-head{ display:flex; align-items:center; gap:10px; padding-bottom:18px; margin-bottom:14px; border-bottom:1px solid var(--rf-border); }
  .proto-logo{
    width:28px; height:28px; border-radius:7px;
    background:radial-gradient(circle at 30% 30%, #fff 0 2px, transparent 2px),
      radial-gradient(circle at 70% 30%, var(--rf-purple) 0 2px, transparent 2px),
      radial-gradient(circle at 30% 70%, var(--rf-purple) 0 2px, transparent 2px),
      radial-gradient(circle at 70% 70%, #fff 0 2px, transparent 2px), #000;
  }
  .proto-side-head h1{ margin:0; font-size:14px; font-weight:600; }
  .proto-side-head h1 small{ display:block; font-size:11px; font-weight:500; color:var(--rf-text-muted); margin-top:2px; }
  .proto-nav-section-title{ font-size:10px; font-weight:600; color:var(--rf-text-dim); text-transform:uppercase; letter-spacing:0.7px; padding:14px 8px 6px; }
  .proto-nav-item{ display:flex; align-items:center; gap:10px; padding:7px 10px; border-radius:6px; color:var(--rf-text-muted); text-decoration:none; font-size:13px; margin-bottom:1px; transition:background 120ms,color 120ms; }
  .proto-nav-item:hover{ background:rgba(255,255,255,0.04); color:var(--rf-text); }
  .proto-nav-item.active{ background:var(--rf-purple-soft); color:var(--rf-text); }
  .proto-nav-item .num{ font-family:'JetBrains Mono',monospace; font-size:11px; color:var(--rf-text-dim); width:26px; text-align:right; }
  .proto-nav-item.active .num{ color:var(--rf-purple); }
  .proto-nav-item.new-screen::after{ content:"NEW"; margin-left:auto; font-size:9px; font-weight:700; letter-spacing:0.5px; background:var(--rf-purple); color:#fff; padding:2px 5px; border-radius:4px; }

  .proto-stage{ padding:48px 56px 200px; max-width:1400px; }
  .state-section{ margin-bottom:64px; scroll-margin-top:32px; }
  .proto-tag{ display:inline-flex; align-items:center; gap:6px; font-size:11px; font-weight:700; letter-spacing:1px; color:var(--rf-text-dim); text-transform:uppercase; padding:4px 10px; border:1px solid var(--rf-border-2); border-radius:999px; margin-bottom:14px; }
  .proto-tag.new{ background:var(--rf-purple-soft); border-color:var(--rf-purple-line); color:var(--rf-purple); }
  .proto-screen-head{ margin-bottom:20px; max-width:880px; }
  .proto-screen-head h1{ margin:0 0 6px; font-size:24px; font-weight:600; }
  .proto-screen-head p{ margin:0; color:var(--rf-text-muted); font-size:14px; max-width:760px; }
  .proto-anno{ margin-top:14px; background:rgba(255,255,255,0.02); border:1px solid var(--rf-border); border-radius:14px; padding:18px 22px; max-width:880px; }
  .proto-anno h3{ margin:0 0 10px; font-size:11px; font-weight:700; letter-spacing:1.2px; color:var(--rf-text-dim); text-transform:uppercase; }
  .proto-anno-grid{ display:grid; grid-template-columns:repeat(auto-fit, minmax(260px,1fr)); gap:12px 28px; }
  .proto-anno-item dt{ font-size:11px; font-weight:600; color:var(--rf-text-muted); margin-bottom:2px; text-transform:uppercase; letter-spacing:0.5px; }
  .proto-anno-item dd{ margin:0; font-size:13px; color:var(--rf-text-2); line-height:1.5; }
  .proto-anno-item dd code{ background:rgba(255,255,255,0.05); padding:1px 5px; border-radius:4px; font-size:11.5px; }
  .key-card{ background:rgba(255,255,255,0.02); border:1px solid var(--rf-border); border-radius:10px; padding:14px 16px; margin-top:20px; font-size:12px; color:var(--rf-text-muted); line-height:1.55; }
  .key-card strong{ color:var(--rf-text); font-weight:600; }

  /* ===== Plugin chrome ===== */
  .plugin-frame{ width:var(--plugin-w); min-height:var(--plugin-h); background:var(--rf-bg); border-radius:14px; overflow:hidden; border:1px solid var(--rf-border); box-shadow:var(--rf-shadow-lg), var(--rf-glow-purple); display:flex; flex-direction:column; }
  .plugin-header{ height:42px; flex:0 0 auto; background:var(--rf-bg-card-2); border-bottom:1px solid var(--rf-border); display:flex; align-items:center; padding:0 14px; gap:10px; }
  .plugin-header-dots-mini{ width:18px; height:18px; border-radius:5px; background:radial-gradient(circle at 30% 30%, #fff 0 1.5px, transparent 1.5px),radial-gradient(circle at 70% 30%, var(--rf-purple) 0 1.5px, transparent 1.5px),radial-gradient(circle at 30% 70%, var(--rf-purple) 0 1.5px, transparent 1.5px),radial-gradient(circle at 70% 70%, #fff 0 1.5px, transparent 1.5px),#000; }
  .plugin-header-title{ font-size:13px; font-weight:600; }
  .plugin-header-x{ margin-left:auto; width:22px; height:22px; border-radius:5px; display:flex; align-items:center; justify-content:center; color:var(--rf-text-muted); }
  .plugin-header-x svg{ width:14px; height:14px; }
  .plugin-body{ flex:1; min-height:0; display:grid; grid-template-columns:var(--sub-nav-w) 1fr; }

  /* sub-nav (grouped accordion) */
  .sub-nav{ background:var(--rf-bg-elev); border-right:1px solid var(--rf-border); padding:14px 10px 12px; display:flex; flex-direction:column; overflow:hidden; }
  .sub-nav-head{ display:flex; align-items:center; gap:8px; padding:4px 8px 12px; border-bottom:1px solid var(--rf-border); margin-bottom:8px; }
  .sub-nav-head-title{ font-size:14px; font-weight:600; color:var(--rf-text); }
  .sub-nav-head-title .purple{ color:var(--rf-purple); }
  .sub-nav-back{ margin-left:auto; color:var(--rf-text-muted); }
  .sub-nav-back svg{ width:15px; height:15px; }
  /* accordion groups */
  .plg-acc-scroll{ flex:1 1 auto; min-height:0; overflow-y:auto; margin:2px -4px 4px; padding:0 4px; }
  .plg-acc-group + .plg-acc-group{ margin-top:1px; }
  .plg-acc-head{ width:100%; display:flex; align-items:center; gap:10px; padding:8px 10px; border:0; background:transparent; color:var(--rf-text-2); font-family:inherit; font-size:13.5px; font-weight:600; text-align:left; cursor:pointer; border-radius:7px; }
  .plg-acc-head:hover{ background:rgba(255,255,255,0.03); color:var(--rf-text); }
  .plg-acc-head.active-group{ color:var(--rf-text); }
  .plg-acc-ico{ width:16px; height:16px; flex:0 0 16px; display:flex; align-items:center; justify-content:center; color:var(--rf-text-muted); }
  .plg-acc-ico svg{ width:16px; height:16px; }
  .plg-acc-head.active-group .plg-acc-ico{ color:var(--rf-purple); }
  .plg-acc-label{ flex:1; }
  .plg-acc-chev{ width:11px; height:11px; flex:0 0 11px; color:var(--rf-text-dim); transition:transform 150ms ease; }
  .plg-acc-group.open .plg-acc-chev{ transform:rotate(90deg); }
  .plg-acc-new{ font-size:8.5px; font-weight:700; letter-spacing:0.5px; background:var(--rf-purple); color:#fff; padding:2px 5px; border-radius:4px; }
  .plg-acc-new.sm{ margin-left:auto; }
  .plg-acc-children{ padding:1px 0 5px; }
  .plg-acc-children[hidden]{ display:none; }
  .plg-acc-item{ display:flex; align-items:center; gap:10px; padding:6px 10px 6px 23px; border-radius:7px; color:var(--rf-text-muted); font-size:13px; cursor:pointer; margin-bottom:1px; }
  .plg-acc-item:hover{ background:rgba(255,255,255,0.03); color:var(--rf-text); }
  .plg-acc-item.active{ background:var(--rf-bg-active); color:var(--rf-text); }
  .plg-acc-item-label{ flex:1; }
  .plg-acc-dot{ width:5px; height:5px; flex:0 0 5px; border-radius:50%; background:var(--rf-border-strong); }
  .plg-acc-item.active .plg-acc-dot{ background:var(--rf-purple); }
  /* bottom foot items */
  .sub-nav-item{ display:flex; align-items:center; gap:10px; padding:7px 10px; border-radius:7px; color:var(--rf-text-muted); font-size:13px; cursor:pointer; margin-bottom:2px; }
  .sub-nav-item:hover{ background:rgba(255,255,255,0.03); color:var(--rf-text); }
  .sub-nav-item .ico{ width:16px; height:16px; flex:0 0 16px; display:flex; align-items:center; justify-content:center; color:currentColor; }
  .sub-nav-item .ico svg{ width:16px; height:16px; }
  .sub-nav-item > svg{ width:16px; height:16px; flex:0 0 16px; }
  .sub-nav-foot{ border-top:1px solid var(--rf-border); padding-top:8px; margin-top:6px; display:flex; flex-direction:column; gap:2px; }
  .sub-nav-user{ display:flex; align-items:center; gap:10px; padding:10px; background:var(--rf-bg-card); border:1px solid var(--rf-border); border-radius:10px; margin-bottom:6px; margin-top:8px; }
  .sub-nav-user-av{ width:30px; height:30px; border-radius:50%; background:var(--rf-purple); display:flex; align-items:center; justify-content:center; font-size:10px; font-weight:700; flex:0 0 30px; }
  .sub-nav-user-av.teal{ background:var(--rf-teal); }
  .sub-nav-user-meta{ overflow:hidden; }
  .sub-nav-user-meta .name{ font-size:12px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .sub-nav-user-meta .email{ font-size:10px; color:var(--rf-text-dim); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .sub-nav-cta{ display:flex; align-items:center; justify-content:center; gap:6px; padding:8px; border-radius:8px; font-size:12.5px; font-weight:600; cursor:pointer; border:1px solid transparent; }
  .sub-nav-cta.purple{ background:linear-gradient(180deg, var(--rf-purple) 0%, var(--rf-purple-deep) 100%); color:#fff; }
  .sub-nav-cta.red{ background:rgba(221,82,76,0.10); border-color:rgba(221,82,76,0.35); color:var(--rf-red); margin-top:4px; }
  .sub-nav-cta svg{ width:13px; height:13px; }

  /* plugin main */
  .plugin-main{ background:var(--rf-bg); overflow-y:auto; padding:24px 28px 40px; position:relative; }
  .plugin-main h1.section-title{ margin:0 0 4px; font-size:22px; font-weight:600; }
  .plugin-main p.section-sub{ margin:0 0 18px; color:var(--rf-text-muted); font-size:13px; }

  /* feature tabs */
  .feature-tabs{ display:flex; align-items:center; border-bottom:1px solid var(--rf-border); margin:-4px -28px 22px; padding:0 28px; }
  .feature-tab{ position:relative; padding:12px 4px 13px; margin-right:24px; color:var(--rf-text-muted); font-size:14px; font-weight:500; cursor:pointer; background:none; border:0; font-family:inherit; display:inline-flex; align-items:center; gap:8px; }
  .feature-tab:hover{ color:var(--rf-text-2); }
  .feature-tab.active{ color:var(--rf-purple); font-weight:600; }
  .feature-tab.active::after{ content:""; position:absolute; left:0; right:0; bottom:-1px; height:2px; background:var(--rf-purple); border-radius:2px 2px 0 0; }
  .feature-tab.locked{ color:var(--rf-text-faint); cursor:not-allowed; }
  .feature-tab .ft-count{ font-size:11px; font-weight:500; color:var(--rf-text-dim); background:rgba(255,255,255,0.04); border-radius:var(--rf-radius-pill); padding:1px 7px; }
  .feature-tab.active .ft-count{ background:var(--rf-purple-soft); color:var(--rf-purple); }
  .feature-tab .ft-dot{ width:6px; height:6px; border-radius:50%; background:var(--rf-amber); flex:0 0 6px; }
  .feature-tab .ft-lock{ width:11px; height:11px; color:var(--rf-text-faint); }
  .feature-tab .kbd{ font-size:9.5px; font-family:'JetBrains Mono',monospace; color:var(--rf-text-dim); background:rgba(255,255,255,0.04); padding:1px 5px; border-radius:3px; }

  /* toggle */
  .toggle-pill{ width:44px; height:24px; border-radius:99px; background:var(--rf-bg-card-3); border:1px solid var(--rf-border-2); position:relative; cursor:pointer; flex:0 0 auto; }
  .toggle-pill .knob{ position:absolute; top:2px; left:2px; width:18px; height:18px; border-radius:50%; background:#fff; transition:left 120ms; }
  .toggle-pill.on{ background:linear-gradient(180deg, var(--rf-purple) 0%, var(--rf-purple-deep) 100%); border-color:var(--rf-purple-line); }
  .toggle-pill.on .knob{ left:22px; }

  /* buttons */
  .btn-primary{ display:inline-flex; align-items:center; justify-content:center; gap:8px; background:linear-gradient(180deg, var(--rf-purple-btn-2), var(--rf-purple-btn)); border:1px solid var(--rf-purple-line); color:#fff; padding:10px 16px; border-radius:var(--rf-radius-md); font-size:13px; font-weight:600; cursor:pointer; box-shadow:0 0 20px var(--rf-purple-glow); font-family:inherit; }
  .btn-primary.full{ width:100%; }
  .btn-primary.lg{ height:56px; font-size:15px; }
  .btn-primary svg{ width:15px; height:15px; }
  .btn-primary:disabled,.btn-primary.disabled{ background:var(--rf-bg-card-3); border-color:var(--rf-border-2); color:var(--rf-text-dim); box-shadow:none; cursor:not-allowed; }
  .btn-secondary{ display:inline-flex; align-items:center; justify-content:center; gap:8px; background:var(--rf-bg-card-3); color:var(--rf-text); border:1px solid var(--rf-border-2); padding:10px 16px; border-radius:var(--rf-radius-md); font-size:13px; font-weight:600; cursor:pointer; font-family:inherit; }
  .btn-secondary svg{ width:15px; height:15px; }
  .btn-generate{ display:inline-flex; align-items:center; gap:6px; background:var(--rf-bg-card-3); color:var(--rf-text); border:1px solid var(--rf-border-2); height:30px; padding:0 12px; border-radius:var(--rf-radius-md); font-size:12px; font-weight:500; cursor:pointer; }
  .btn-generate.purple{ background:var(--rf-purple-soft); border-color:var(--rf-purple-line); color:var(--rf-purple); }
  .btn-generate svg{ width:13px; height:13px; }
  .btn-generate.disabled{ color:var(--rf-text-faint); border-color:var(--rf-border); cursor:not-allowed; background:transparent; }
  .lib-btn{ display:inline-flex; align-items:center; gap:6px; height:30px; padding:0 12px; background:var(--rf-bg-card); border:1px solid var(--rf-border-2); border-radius:var(--rf-radius-md); font-size:12px; color:var(--rf-text); cursor:pointer; }
  .lib-btn.link{ background:transparent; border-color:transparent; color:var(--rf-blue); }
  .lib-btn svg{ width:13px; height:13px; }
  .schema-action-btn{ display:flex; align-items:center; justify-content:center; gap:8px; height:54px; border-radius:var(--rf-radius-md); border:1px solid var(--rf-border-2); background:var(--rf-bg-card); color:var(--rf-text); font-size:14px; font-weight:600; cursor:pointer; width:100%; margin-bottom:14px; font-family:inherit; }
  .schema-action-btn.primary{ background:linear-gradient(180deg, var(--rf-purple-btn-2), var(--rf-purple-btn)); border-color:var(--rf-purple-line); color:#fff; box-shadow:0 0 20px var(--rf-purple-glow); }
  .schema-action-btn.disabled{ background:var(--rf-bg-card-3); border-color:var(--rf-border-2); color:var(--rf-text-dim); box-shadow:none; cursor:not-allowed; }
  .schema-action-btn svg{ width:17px; height:17px; }

  .scan-all-cta{ display:flex; align-items:center; gap:12px; padding:12px 16px; background:rgba(186,36,213,0.05); border:1px solid var(--rf-purple-line); border-radius:var(--rf-radius-lg); margin-bottom:18px; cursor:pointer; }
  .scan-all-cta:hover{ background:rgba(186,36,213,0.10); }
  .scan-all-cta.disabled{ background:var(--rf-bg-card); border-color:var(--rf-border); cursor:not-allowed; opacity:0.6; }
  .scan-all-cta-ico{ width:32px; height:32px; border-radius:var(--rf-radius-md); background:rgba(186,36,213,0.12); color:var(--rf-purple); display:flex; align-items:center; justify-content:center; flex:0 0 auto; }
  .scan-all-cta-ico svg{ width:17px; height:17px; }
  .scan-all-cta-text{ flex:1; }
  .scan-all-cta-text strong{ display:block; font-size:13px; font-weight:600; color:var(--rf-text); }
  .scan-all-cta-text span{ display:block; font-size:11.5px; color:var(--rf-text-muted); margin-top:1px; }
  .scan-all-cta-arrow{ color:var(--rf-purple); font-size:14px; }

  /* stepper */
  .stepper{ display:flex; align-items:center; gap:0; margin:0 0 20px; }
  .stepper-step{ display:flex; align-items:center; gap:8px; color:var(--rf-text-dim); }
  .stepper-step .step-num{ width:24px; height:24px; border-radius:50%; background:var(--rf-bg-card-3); border:1px solid var(--rf-border-2); display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:700; flex:0 0 24px; }
  .stepper-step .step-label{ font-size:12px; font-weight:500; }
  .stepper-step.active{ color:var(--rf-purple); }
  .stepper-step.active .step-num{ background:var(--rf-purple-soft); border-color:var(--rf-purple-line); color:var(--rf-purple); }
  .stepper-step.done{ color:var(--rf-green); }
  .stepper-step.done .step-num{ background:var(--rf-green-soft); border-color:rgba(74,222,128,0.30); color:var(--rf-green); }
  .stepper-divider{ flex:1; height:1px; background:var(--rf-border-2); margin:0 12px; min-width:18px; }

  /* editor head */
  .editor-head{ display:flex; align-items:flex-start; gap:14px; margin-bottom:14px; }
  .editor-head-text h2{ margin:0; font-size:18px; font-weight:600; }
  .editor-head-text p{ margin:2px 0 0; font-size:12.5px; color:var(--rf-text-muted); }
  .editor-back{ margin-left:auto; display:inline-flex; align-items:center; gap:5px; color:var(--rf-text-muted); font-size:13px; cursor:pointer; }
  .editor-back svg{ width:14px; height:14px; }
  .editor-footer{ display:flex; align-items:center; gap:10px; margin-top:18px; }
  .editor-footer .left-text{ flex:1; color:var(--rf-text-muted); font-size:12px; }

  /* page search + rows */
  .page-search{ display:flex; align-items:center; gap:8px; background:var(--rf-bg-input); border:1px solid var(--rf-border-2); border-radius:var(--rf-radius-md); padding:9px 12px; margin-bottom:14px; color:var(--rf-text-muted); }
  .page-search svg{ width:15px; height:15px; }
  .page-search input{ background:transparent; border:0; outline:none; color:var(--rf-text); font-family:inherit; font-size:13px; flex:1; }
  .page-row{ display:grid; grid-template-columns:auto 1fr auto auto auto; gap:14px; align-items:center; padding:12px 14px; background:var(--rf-bg-card); border:1px solid var(--rf-border); border-radius:var(--rf-radius-lg); margin-bottom:8px; }
  .page-row:hover{ border-color:var(--rf-border-strong); }
  .page-row-ico{ width:34px; height:34px; border-radius:8px; background:var(--rf-bg-card-3); display:flex; align-items:center; justify-content:center; color:var(--rf-text-muted); flex:0 0 34px; }
  .page-row-ico svg{ width:17px; height:17px; }
  .page-row-ico.green-bg{ background:var(--rf-green-soft); color:var(--rf-green); }
  .page-row-meta .path{ font-size:13px; color:var(--rf-text); font-weight:500; }
  .page-row-meta .url{ font-family:'JetBrains Mono',monospace; font-size:11px; color:var(--rf-text-dim); margin-top:2px; }
  .page-row-pill{ display:inline-flex; align-items:center; gap:6px; font-size:11px; font-weight:600; padding:4px 9px; border-radius:var(--rf-radius-pill); background:var(--rf-green-soft); color:var(--rf-green); white-space:nowrap; }
  .page-row-pill.gray{ background:rgba(155,161,174,0.10); color:var(--rf-text-muted); }
  .page-row-pill.amber{ background:var(--rf-amber-soft); color:var(--rf-amber); }
  .page-row-pill .dot-st{ width:6px; height:6px; border-radius:50%; background:currentColor; }
  .cms-badge{ display:inline-block; margin-left:8px; font-size:9px; font-weight:700; letter-spacing:0.5px; padding:2px 6px; border-radius:4px; background:rgba(186,36,213,0.15); color:var(--rf-purple); }
  .lock-badge{ display:inline-flex; align-items:center; gap:4px; font-size:10px; font-weight:600; padding:3px 8px; border-radius:var(--rf-radius-pill); background:var(--rf-amber-soft); color:var(--rf-amber); }
  .lock-badge svg{ width:11px; height:11px; }

  /* spinner */
  .spinner-wrap{ text-align:center; padding:40px 20px 10px; }
  .spinner{ width:40px; height:40px; margin:0 auto 16px; border-radius:50%; border:2px solid #1A1D24; border-top-color:var(--rf-purple); animation:spin 0.8s linear infinite; box-shadow:0 0 20px rgba(186,36,213,0.2); }
  @keyframes spin{ to{ transform:rotate(360deg); } }
  .spinner-sm{ width:15px; height:15px; border-radius:50%; border:2px solid #1A1D24; border-top-color:var(--rf-purple); animation:spin 0.8s linear infinite; display:inline-block; vertical-align:middle; flex:0 0 15px; }
  .spinner-wrap p{ margin:0 0 4px; font-size:14px; color:var(--rf-text); font-weight:500; }
  .spinner-wrap small{ font-size:12px; color:var(--rf-text-muted); }
  .step-log{ margin:18px auto 0; max-width:440px; text-align:left; }
  .step-log-row{ display:flex; align-items:center; gap:9px; padding:7px 0; font-size:12.5px; color:var(--rf-text-2); }
  .step-log-row svg{ width:15px; height:15px; flex:0 0 15px; }
  .step-log-row .ok{ color:var(--rf-green); }

  /* progress bar */
  .progress-bar-wrap{ display:flex; align-items:center; gap:14px; margin-top:18px; }
  .progress-bar{ flex:1; height:6px; background:var(--rf-bg-card-3); border-radius:99px; overflow:hidden; position:relative; }
  .progress-bar .fill{ position:absolute; inset:0 auto 0 0; background:linear-gradient(90deg, var(--rf-purple), var(--rf-purple-btn-2)); border-radius:99px; }
  .progress-bar-label{ color:var(--rf-text-muted); font-size:12px; white-space:nowrap; }

  /* suggest cards */
  .suggest-card{ background:var(--rf-bg-card); border:1px solid var(--rf-border-2); border-radius:var(--rf-radius-lg); padding:14px 16px; margin-bottom:10px; display:grid; grid-template-columns:auto 1fr; gap:14px; align-items:flex-start; }
  .suggest-card.selected{ border-color:var(--rf-purple-line); background:var(--rf-purple-soft-2); box-shadow:0 0 0 1px var(--rf-purple-line); }
  .suggest-checkbox{ width:22px; height:22px; border:1.5px solid var(--rf-border-strong); border-radius:6px; display:flex; align-items:center; justify-content:center; cursor:pointer; margin-top:2px; flex:0 0 22px; color:transparent; }
  .suggest-checkbox.checked{ background:var(--rf-purple); border-color:var(--rf-purple); color:#fff; }
  .suggest-checkbox svg{ width:13px; height:13px; }
  .suggest-meta .title-row{ display:flex; align-items:center; gap:8px; margin-bottom:4px; }
  .suggest-meta .name{ font-size:14px; font-weight:600; }
  .suggest-tag{ font-size:10px; font-weight:700; letter-spacing:0.5px; text-transform:uppercase; padding:3px 9px; border-radius:4px; background:rgba(74,222,128,0.14); color:var(--rf-green); border:1px solid rgba(74,222,128,0.40); }
  .suggest-tag.optional{ background:rgba(255,255,255,0.04); color:var(--rf-text-muted); border:1px solid var(--rf-border-2); }
  .suggest-meta .desc{ font-size:12.5px; color:var(--rf-text-muted); line-height:1.5; }
  .suggest-meta .preview{ margin-top:6px; font-size:11px; color:var(--rf-text-dim); font-family:'JetBrains Mono',monospace; }

  /* needs attention */
  .needs-attention{ background:var(--rf-bg-card); border:1px solid var(--rf-border); border-radius:var(--rf-radius-lg); padding:4px 16px 8px; }
  .needs-attention-head{ display:flex; align-items:center; gap:8px; padding:13px 0 6px; font-size:11px; font-weight:700; letter-spacing:0.5px; text-transform:uppercase; color:var(--rf-text-dim); }
  .needs-attention-head svg{ width:14px; height:14px; color:var(--rf-amber); }
  .needs-attention-row{ display:grid; grid-template-columns:auto 1fr auto; gap:12px; align-items:center; padding:11px 0; border-top:1px solid var(--rf-border); }
  .needs-attention-ico{ width:30px; height:30px; border-radius:var(--rf-radius-md); display:flex; align-items:center; justify-content:center; flex:0 0 30px; }
  .needs-attention-ico svg{ width:15px; height:15px; }
  .needs-attention-ico.failed{ background:var(--rf-red-soft); color:var(--rf-red); }
  .needs-attention-ico.warning{ background:var(--rf-amber-soft); color:var(--rf-amber); }
  .needs-attention-ico.uncovered{ background:rgba(59,130,246,0.12); color:var(--rf-blue); }
  .needs-attention-text strong{ font-size:13px; }
  .needs-attention-action{ background:var(--rf-bg-card-3); border:1px solid var(--rf-border-2); color:var(--rf-text); padding:6px 12px; border-radius:var(--rf-radius-md); font-size:12px; font-weight:600; cursor:pointer; font-family:inherit; white-space:nowrap; }

  /* banners */
  .xf-banner{ background:rgba(20,184,166,0.06); border:1px solid rgba(20,184,166,0.30); border-radius:var(--rf-radius-lg); padding:13px 16px; margin-bottom:14px; display:grid; grid-template-columns:auto 1fr auto; gap:12px; align-items:center; }
  .xf-banner-ico{ width:32px; height:32px; border-radius:var(--rf-radius-md); background:rgba(20,184,166,0.12); color:var(--rf-teal); display:flex; align-items:center; justify-content:center; flex:0 0 32px; }
  .xf-banner-ico svg{ width:16px; height:16px; }
  .xf-banner-text{ font-size:12.5px; color:var(--rf-text-2); line-height:1.5; }
  .xf-banner-text strong{ color:var(--rf-text); }
  .xf-banner-cta{ background:transparent; border:1px solid rgba(20,184,166,0.40); color:var(--rf-teal); padding:6px 12px; border-radius:var(--rf-radius-md); font-size:11.5px; font-weight:600; cursor:pointer; font-family:inherit; white-space:nowrap; }
  .uncovered-banner{ background:var(--rf-amber-soft); border:1px solid rgba(245,185,25,0.25); border-radius:var(--rf-radius-lg); padding:14px 16px; margin-bottom:14px; display:grid; grid-template-columns:auto 1fr auto; gap:14px; align-items:center; }
  .uncovered-banner-ico{ width:32px; height:32px; border-radius:var(--rf-radius-md); background:rgba(245,185,25,0.12); color:var(--rf-amber); display:flex; align-items:center; justify-content:center; flex:0 0 32px; }
  .uncovered-banner-ico svg{ width:16px; height:16px; }
  .uncovered-banner-text strong{ display:block; font-size:13px; font-weight:600; color:var(--rf-text); }
  .uncovered-banner-text span{ display:block; font-size:11.5px; color:var(--rf-text-muted); margin-top:2px; }
  .uncovered-banner-cta{ background:var(--rf-amber); color:#1A1D24; border:0; padding:7px 14px; border-radius:var(--rf-radius-md); font-size:12px; font-weight:600; cursor:pointer; font-family:inherit; white-space:nowrap; }
  .info-note{ display:flex; gap:10px; align-items:flex-start; padding:12px 14px; background:rgba(186,36,213,0.04); border:1px solid var(--rf-purple-line); border-radius:var(--rf-radius-lg); font-size:12px; color:var(--rf-text-2); line-height:1.5; margin-top:12px; }
  .info-note.amber{ background:var(--rf-amber-soft); border-color:rgba(245,185,25,0.30); }
  .info-note.teal{ background:rgba(20,184,166,0.06); border-color:rgba(20,184,166,0.30); }
  .info-note.plain{ background:var(--rf-bg-card); border-color:var(--rf-border); }
  .info-note .ni{ flex:0 0 16px; color:var(--rf-purple); margin-top:1px; }
  .info-note.amber .ni{ color:var(--rf-amber); }
  .info-note.teal .ni{ color:var(--rf-teal); }
  .info-note .ni svg{ width:16px; height:16px; }
  .info-note strong{ color:var(--rf-text); }

  /* toast */
  .toast{ background:var(--rf-bg-card-2); border:1px solid var(--rf-border-2); border-left:3px solid var(--rf-green); border-radius:var(--rf-radius-md); padding:11px 14px; display:flex; align-items:center; gap:10px; box-shadow:var(--rf-shadow-md); width:fit-content; margin-bottom:16px; }
  .toast.purple{ border-left-color:var(--rf-purple); }
  .toast .t-ico{ color:var(--rf-green); display:flex; }
  .toast.purple .t-ico{ color:var(--rf-purple); }
  .toast .t-ico svg{ width:16px; height:16px; }
  .toast .t-txt{ font-size:13px; color:var(--rf-text); font-weight:500; }

  /* JSON */
  .json-card{ background:var(--rf-bg-card); border:1px solid var(--rf-border); border-radius:var(--rf-radius-lg); padding:16px 18px; margin-bottom:12px; }
  .json-head{ display:flex; align-items:center; gap:10px; margin-bottom:12px; }
  .json-head h3{ margin:0; font-size:14px; font-weight:600; }
  .json-copy{ margin-left:auto; display:inline-flex; align-items:center; gap:6px; height:28px; padding:0 11px; background:var(--rf-bg-card-3); border:1px solid var(--rf-border-2); border-radius:var(--rf-radius-md); font-size:11.5px; color:var(--rf-text); cursor:pointer; }
  .json-copy svg{ width:12px; height:12px; }
  .json-block{ background:var(--rf-bg); border:1px solid var(--rf-border); border-radius:9px; padding:14px 16px; font-family:'JetBrains Mono',monospace; font-size:11.5px; line-height:1.65; color:var(--rf-text-2); overflow:auto; max-height:300px; white-space:pre; }
  .json-block .k{ color:#7DD3FC; } .json-block .s{ color:#A7F3D0; } .json-block .n{ color:#FDE68A; } .json-block .br{ color:#9BA1AE; }

  /* validation */
  .validation-panel{ background:var(--rf-bg-card); border:1px solid var(--rf-border); border-radius:var(--rf-radius-lg); padding:16px 18px; margin-bottom:12px; }
  .validation-head{ display:flex; align-items:center; gap:10px; margin-bottom:6px; }
  .validation-head h3{ margin:0; font-size:14px; font-weight:600; }
  .summary-pill{ margin-left:auto; font-size:11px; font-weight:600; padding:4px 10px; border-radius:var(--rf-radius-pill); }
  .summary-pill.pass{ background:var(--rf-green-soft); color:var(--rf-green); }
  .summary-pill.fail{ background:var(--rf-red-soft); color:var(--rf-red); }
  .summary-pill.warn{ background:var(--rf-amber-soft); color:var(--rf-amber); }
  .v-row{ display:grid; grid-template-columns:24px 1fr auto; gap:12px; align-items:flex-start; padding:10px 0; border-bottom:1px solid var(--rf-border); }
  .v-row:last-child{ border-bottom:0; }
  .v-ico{ width:22px; height:22px; border-radius:50%; display:flex; align-items:center; justify-content:center; flex:0 0 22px; }
  .v-ico svg{ width:13px; height:13px; }
  .v-row.pass .v-ico{ background:var(--rf-green-soft); color:var(--rf-green); }
  .v-row.fail .v-ico{ background:var(--rf-red-soft); color:var(--rf-red); }
  .v-row.warn .v-ico{ background:var(--rf-amber-soft); color:var(--rf-amber); }
  .v-text strong{ display:block; font-size:13px; font-weight:600; color:var(--rf-text); }
  .v-text small{ display:block; font-size:11.5px; color:var(--rf-text-muted); margin-top:2px; }
  .v-fix{ color:var(--rf-purple); font-size:11.5px; font-weight:600; cursor:pointer; white-space:nowrap; }

  /* schema stats */
  .sch-stats{ display:grid; grid-template-columns:repeat(auto-fit, minmax(120px,1fr)); gap:12px; margin-bottom:16px; }
  .sch-stat{ background:var(--rf-bg-card); border:1px solid var(--rf-border); border-radius:var(--rf-radius-lg); padding:14px 16px; }
  .sch-stat .v{ font-size:24px; font-weight:600; letter-spacing:-0.02em; }
  .sch-stat .v.green{ color:var(--rf-green); } .sch-stat .v.amber{ color:var(--rf-amber); } .sch-stat .v.red{ color:var(--rf-red); }
  .sch-stat .l{ font-size:11px; color:var(--rf-text-muted); margin-top:3px; }

  /* library */
  .lib-toolbar{ display:flex; align-items:center; gap:8px; margin-bottom:14px; }
  .lib-search-trigger{ width:36px; height:36px; background:rgba(255,255,255,0.04); border:1px solid var(--rf-border-2); border-radius:var(--rf-radius-md); color:var(--rf-text-muted); display:flex; align-items:center; justify-content:center; cursor:pointer; flex:0 0 36px; }
  .lib-search-trigger svg{ width:15px; height:15px; }
  .lib-filter-pills{ display:flex; gap:4px; background:rgba(255,255,255,0.02); border:1px solid var(--rf-border-2); border-radius:var(--rf-radius-md); padding:2px; }
  .lib-filter-pill{ background:transparent; border:0; padding:5px 11px; font-size:11.5px; border-radius:var(--rf-radius-sm); color:var(--rf-text-muted); cursor:pointer; font-family:inherit; }
  .lib-filter-pill.active{ background:var(--rf-purple-soft); border:1px solid var(--rf-purple-line); color:var(--rf-purple); }
  .lib-page{ background:var(--rf-bg-card); border:1px solid var(--rf-border); border-radius:var(--rf-radius-lg); margin-bottom:10px; overflow:hidden; }
  .lib-page.expanded{ border-color:var(--rf-purple-line); }
  .lib-page-head{ display:grid; grid-template-columns:auto 32px 1fr auto; gap:12px; align-items:center; padding:14px 16px; cursor:pointer; }
  .lib-page-chevron{ color:var(--rf-text-dim); transition:transform 120ms; }
  .lib-page-chevron svg{ width:14px; height:14px; }
  .lib-page.expanded .lib-page-chevron{ transform:rotate(90deg); }
  .lib-page-ico{ width:32px; height:32px; border-radius:8px; background:var(--rf-bg-card-3); display:flex; align-items:center; justify-content:center; color:var(--rf-text-muted); }
  .lib-page-ico svg{ width:16px; height:16px; }
  .lib-page-path{ font-size:13px; font-weight:600; }
  .lib-page-summary{ font-size:11.5px; color:var(--rf-text-muted); margin-top:2px; }
  .lib-page-status{ font-size:11px; font-weight:600; padding:4px 10px; border-radius:var(--rf-radius-pill); }
  .lib-page-status.verified{ background:var(--rf-green-soft); color:var(--rf-green); }
  .lib-page-status.warning{ background:var(--rf-amber-soft); color:var(--rf-amber); }
  .lib-page-status.failed{ background:var(--rf-red-soft); color:var(--rf-red); }
  .lib-page-body{ padding:0 16px 14px; border-top:1px solid var(--rf-border); }
  .lib-schema-row{ display:grid; grid-template-columns:auto 1fr auto auto; gap:12px; align-items:center; padding:11px 0; border-bottom:1px solid var(--rf-border); }
  .lib-schema-row:last-child{ border-bottom:0; }
  .lib-schema-ico{ width:28px; height:28px; border-radius:7px; background:var(--rf-bg-card-3); color:var(--rf-text-muted); display:flex; align-items:center; justify-content:center; flex:0 0 28px; }
  .lib-schema-ico.purple{ background:var(--rf-purple-soft); color:var(--rf-purple); }
  .lib-schema-ico svg{ width:14px; height:14px; }
  .lib-schema-name{ font-size:13px; font-weight:600; display:flex; align-items:center; gap:8px; }
  .src-tag{ font-size:9.5px; font-weight:700; letter-spacing:0.4px; padding:2px 6px; border-radius:4px; text-transform:uppercase; }
  .src-tag.auto{ background:var(--rf-purple-soft); color:var(--rf-purple); }
  .src-tag.llmseo{ background:rgba(20,184,166,0.12); color:var(--rf-teal); }
  .lib-schema-status{ font-size:11px; font-weight:600; padding:3px 9px; border-radius:var(--rf-radius-pill); }
  .lib-schema-status.verified{ background:var(--rf-green-soft); color:var(--rf-green); }
  .lib-schema-status.warning{ background:var(--rf-amber-soft); color:var(--rf-amber); }
  .lib-schema-status.failed{ background:var(--rf-red-soft); color:var(--rf-red); }
  .row-icon-btn{ width:28px; height:28px; border-radius:6px; border:1px solid var(--rf-border-2); display:inline-flex; align-items:center; justify-content:center; color:var(--rf-text-muted); cursor:pointer; }
  .row-icon-btn.danger:hover{ color:var(--rf-red); }
  .row-icon-btn svg{ width:13px; height:13px; }
  .lib-schema-actions{ display:flex; gap:6px; }
  .cms-coverage-card{ background:rgba(186,36,213,0.03); border:1px solid var(--rf-purple-line); border-radius:var(--rf-radius-md); padding:12px 14px; margin-top:10px; }
  .cms-coverage-head{ display:flex; align-items:center; gap:8px; margin-bottom:8px; font-size:11.5px; color:var(--rf-text-2); }
  .cms-coverage-head svg{ width:14px; height:14px; color:var(--rf-purple); }
  .cms-coverage-bar{ height:6px; background:rgba(255,255,255,0.04); border-radius:99px; overflow:hidden; }
  .cms-coverage-fill{ height:100%; background:var(--rf-green); }

  /* verification all-clear */
  .verif-allclear{ background:linear-gradient(180deg, rgba(74,222,128,0.04), rgba(74,222,128,0.01)); border:1px solid rgba(74,222,128,0.25); border-radius:var(--rf-radius-lg); padding:30px 24px; text-align:center; margin-bottom:16px; }
  .verif-allclear-ico{ width:64px; height:64px; border-radius:50%; background:rgba(74,222,128,0.10); color:var(--rf-green); display:inline-flex; align-items:center; justify-content:center; margin-bottom:14px; }
  .verif-allclear-ico svg{ width:32px; height:32px; }
  .verif-allclear h3{ font-size:18px; font-weight:600; margin:0 0 6px; }
  .verif-allclear p{ font-size:13px; color:var(--rf-text-muted); margin:0 0 18px; }
  .issue-card{ background:var(--rf-bg-card); border:1px solid var(--rf-border); border-left:3px solid var(--rf-border); border-radius:var(--rf-radius-lg); padding:14px 16px; margin-bottom:10px; display:grid; grid-template-columns:auto 1fr auto; gap:12px; align-items:center; }
  .issue-card.fail{ border-left-color:var(--rf-red); }
  .issue-card.warn{ border-left-color:var(--rf-amber); }
  .issue-card-ico{ width:32px; height:32px; border-radius:var(--rf-radius-md); display:flex; align-items:center; justify-content:center; flex:0 0 32px; }
  .issue-card-ico svg{ width:16px; height:16px; }
  .issue-card.fail .issue-card-ico{ background:var(--rf-red-soft); color:var(--rf-red); }
  .issue-card.warn .issue-card-ico{ background:var(--rf-amber-soft); color:var(--rf-amber); }
  .issue-card-text strong{ font-size:13px; }
  .issue-card-text span{ display:block; font-size:11.5px; color:var(--rf-text-muted); margin-top:2px; }

  /* settings */
  .settings-section{ margin-bottom:22px; }
  .settings-section h3{ font-size:11px; font-weight:700; letter-spacing:0.8px; text-transform:uppercase; color:var(--rf-text-dim); margin:0 0 12px; }
  .settings-row{ display:flex; align-items:center; gap:14px; padding:12px 14px; background:var(--rf-bg-card); border:1px solid var(--rf-border); border-radius:var(--rf-radius-lg); margin-bottom:8px; }
  .settings-row-text{ flex:1; }
  .settings-row-text strong{ font-size:13px; }
  .settings-row-text span{ display:block; font-size:11.5px; color:var(--rf-text-muted); margin-top:2px; }

  /* first run illustration */
  .first-run-illust{ display:grid; grid-template-columns:1fr 1fr; gap:12px; margin:20px 0 24px; }
  .first-run-card{ background:var(--rf-bg-card); border:1px solid var(--rf-border); border-radius:var(--rf-radius-md); padding:14px; position:relative; }
  .first-run-card-label{ position:absolute; top:-9px; left:12px; background:var(--rf-bg); padding:0 8px; font-size:10px; font-weight:700; letter-spacing:0.5px; text-transform:uppercase; color:var(--rf-text-dim); }
  .first-run-card.after .first-run-card-label{ color:var(--rf-purple); }
  .frc-result-title{ font-size:13px; color:var(--rf-blue); font-weight:500; margin-bottom:2px; }
  .frc-result-url{ font-size:10.5px; color:var(--rf-green); margin-bottom:6px; }
  .frc-result-snippet{ font-size:11px; color:var(--rf-text-muted); line-height:1.4; }
  .frc-result-rich{ display:flex; gap:8px; margin-top:8px; align-items:center; }
  .frc-stars{ color:var(--rf-amber); font-size:11px; }
  .frc-img{ width:36px; height:36px; border-radius:4px; background:linear-gradient(135deg, var(--rf-purple), var(--rf-blue)); flex:0 0 36px; }
  .frc-faq{ margin-top:6px; padding:6px 8px; background:rgba(255,255,255,0.03); border-radius:4px; font-size:10.5px; color:var(--rf-text-muted); display:flex; align-items:center; gap:5px; }

  /* ===== LLM SEO ===== */
  .score-hero{ display:grid; grid-template-columns:auto 1fr; gap:24px; align-items:center; padding:22px 24px; background:var(--rf-bg-card); border:1px solid var(--rf-border); border-radius:var(--rf-radius-lg); margin-bottom:14px; }
  .score-ring-wrap{ position:relative; width:120px; height:120px; flex:0 0 120px; }
  .score-ring-bg{ width:100%; height:100%; border-radius:50%; }
  .score-ring-inner{ position:absolute; inset:9px; background:var(--rf-bg-card); border-radius:50%; display:flex; flex-direction:column; align-items:center; justify-content:center; }
  .score-num{ font-size:32px; font-weight:700; color:var(--rf-text); line-height:1; }
  .score-num-suffix{ font-size:11px; color:var(--rf-text-dim); margin-top:2px; }
  .score-meta-head{ font-size:10.5px; font-weight:700; letter-spacing:1px; text-transform:uppercase; color:var(--rf-text-dim); }
  .score-meta-title{ font-size:18px; font-weight:600; margin:4px 0 8px; }
  .score-tier-pill{ display:inline-flex; align-items:center; gap:6px; font-size:11px; padding:3px 10px; border-radius:var(--rf-radius-pill); }
  .score-tier-pill.high{ background:var(--rf-green-soft); color:var(--rf-green); }
  .score-tier-pill.medium{ background:var(--rf-amber-soft); color:var(--rf-amber); }

function stepperHTML(steps, active){
  const ai = steps.findIndex(s=>s.k===active);
  return '<div class="stepper">'+steps.map((s,i)=>{
    const cls = i<ai?'done':(i===ai?'active':'');
    return '<div class="stepper-step '+cls+'"><div class="step-num">'+(i<ai?'✓':(i+1))+'</div><span class="step-label">'+s.label+'</span></div>'+(i<steps.length-1?'<div class="stepper-divider"></div>':'');
  }).join('')+'</div>';
}

function jsonBlock(title, obj){
  return '<div class="json-card"><div class="json-head"><h3>'+title+'</h3><div class="json-copy">'+ico.copy+'<span>Copy</span></div></div><div class="json-block">'+jsonHTML(obj)+'</div></div>';
}
function jsonHTML(obj, indent){
  indent = indent||0;
  if(typeof obj==='string') return '<span class="s">"'+obj.replace(/</g,'&lt;')+'"</span>';
  if(typeof obj==='number'||typeof obj==='boolean') return '<span class="n">'+obj+'</span>';
  if(obj===null) return '<span class="n">null</span>';
  const pad='  '.repeat(indent), padIn='  '.repeat(indent+1);
  if(Array.isArray(obj)){
    if(!obj.length) return '<span class="br">[]</span>';
    return '<span class="br">[</span>\n'+obj.map(v=>padIn+jsonHTML(v,indent+1)).join(',\n')+'\n'+pad+'<span class="br">]</span>';
  }
  const keys=Object.keys(obj);
  if(!keys.length) return '<span class="br">{}</span>';
  return '<span class="br">{</span>\n'+keys.map(k=>padIn+'<span class="k">"'+k+'"</span><span class="br">:</span> '+jsonHTML(obj[k],indent+1)).join(',\n')+'\n'+pad+'<span class="br">}</span>';
}

function vRow(state, title, sub, fix){
  const m={pass:ico.check,fail:ico.x,warn:ico.alert};
  return '<div class="v-row '+state+'"><div class="v-ico">'+m[state]+'</div><div class="v-text"><strong>'+title+'</strong>'+(sub?'<small>'+sub+'</small>':'')+'</div>'+(fix?'<div class="v-fix">'+fix+'</div>':'')+'</div>';
}
function factorRow(state, name, desc, score, pct){
  return '<div class="factor-row"><div class="factor-glyph '+state+'">'+(state==='good'?ico.check:ico.alert)+'</div><div><div class="factor-name">'+name+'</div><div class="factor-desc">'+desc+'</div></div><div class="factor-points">'+score+'</div><div class="factor-bar"><div class="factor-fill '+state+'" style="width:'+pct+'%"></div></div></div>';
}

screens.push({ id:'s17', group:'LLM SEO · Score', tag:'LLM SEO · Score', title:'First run (no score)', desc:'Brand new to LLM SEO. The six citability metrics are previewed empty before the first analysis runs.', newScreen:true,

/* ===== SCHEMA · EDGE CASES ===== */
screens.push({ id:'s35', group:'Schema · Edge cases', tag:'Schema · Error', title:'Detection failed (retry)', desc:'The AI detection call failed (timeout or model error). The flow holds state, explains what happened, and offers a one-click retry instead of dumping the user back to the start.', newScreen:true,
  body: pluginFrame('schema',
    schemaSectionHead('generate')+schemaStepper('detect')+
    '<div class="editor-head"><div class="editor-head-text"><h2>Auto-Generate · /projects/rkg</h2></div><div class="editor-back">'+ico.back+'<span>Back</span></div></div>'+
    '<div class="state-block"><div class="sb-ico red">'+ico.alert+'</div><h3>Detection could not finish</h3><p>The model timed out while reading this page. Your place in the flow is saved, nothing was injected.</p>'+
    '<div class="err-panel"><div class="err-code">AI_TIMEOUT · request 8f2a1c</div><div class="err-msg">The detection request to <code>claude-sonnet-4-6</code> exceeded 30s. This is usually transient on very large pages. Retrying often succeeds.</div></div>'+
    '<div class="state-actions"><button class="btn-secondary">'+ico.back+'<span>Pick another page</span></button><button class="btn-primary">'+ico.refresh+'<span>Retry detection</span></button></div></div>',
    'admin'),
  anno:[['State preserved','A failed detection does not reset the flow. The user stays on the same page and step.'],['Honest error','The error code and model name are shown so support can trace it.'],['No partial write','The copy makes clear nothing was injected, so retry is safe.'],['One-click recovery','Retry re-runs detection. Pick another page is the alternate exit.']] });

screens.push({ id:'s36', group:'Schema · Edge cases', tag:'Schema · Error', title:'Injection failed (permission)', desc:'Detection succeeded but writing to the site head failed because the plugin lacks the setCustomCode permission. The schema is preserved so the user can retry after granting access.', newScreen:true,
  body: pluginFrame('schema',
    schemaSectionHead('generate')+schemaStepper('inject')+
    '<div class="editor-head"><div class="editor-head-text"><h2>Auto-Generate · /projects/rkg</h2><p>3 schemas detected and ready</p></div></div>'+
    '<div class="state-block"><div class="sb-ico red">'+ico.x+'</div><h3>Could not inject into the site head</h3><p>The schema is generated and saved, but RankFrame was blocked from writing it to your site. This usually means the plugin lacks Custom Code permission.</p>'+
    '<div class="err-panel"><div class="err-code">SET_CUSTOM_CODE_DENIED</div><div class="err-msg">Framer rejected <code>setCustomCode()</code>. Custom code is a site-wide head injection and requires the plugin to be allowed. Check Plugin permissions in Framer, then retry.</div></div>'+
    '<div class="state-actions"><button class="btn-secondary">'+ico.info+'<span>How to grant access</span></button><button class="btn-primary">'+ico.refresh+'<span>Retry injection</span></button></div></div>'+
    '<div class="info-note plain"><span class="ni">'+ico.info+'</span><div>RankFrame injects schema as a single site-wide block via <code>setCustomCode({location:"headEnd"})</code>. Framer has no per-page head API, so all schema lives in one managed block keyed by page path.</div></div>',
    'admin'),
  anno:[['Generation vs injection','Detection succeeded. Only the write step failed, so the schema is not lost.'],['Real API constraint','setCustomCode is site-wide. The note states the actual Framer limitation honestly.'],['Permission path','How to grant access explains the fix; Retry re-attempts the write.'],['No data loss','The generated schema persists so retry does not re-bill the AI call.']] });

screens.push({ id:'s37', group:'Schema · Edge cases', tag:'Schema · Not ready', title:'Site not crawled yet (no pages)', desc:'A first-time user before any crawl. There are no pages to act on yet, so the empty state routes straight to a recrawl rather than showing an empty list.', newScreen:true,
  body: pluginFrame('schema',
    schemaSectionHead('generate')+
    '<div class="state-block"><div class="sb-ico blue">'+ico.globe+'</div><h3>We have not crawled your site yet</h3><p>RankFrame builds the page list from your published-site crawl plus sitemap.xml. Run a crawl to unlock schema generation across every page.</p>'+

    'admin'),
  anno:[['No empty table','When there are no pages, the state routes to the action that creates them.'],['Accurate source','Pages come from crawl plus sitemap.xml. The note states this precisely.'],['Publish prerequisite','An unpublished site has no crawlable URL, which the note calls out.'],['Single CTA','One button, crawl now, removes any guesswork about the next step.']] });

screens.push({ id:'s38', group:'Schema · Edge cases', tag:'Schema · Bulk', title:'Whole-site scan results', desc:'The bulk scan finished. A summary tallies generated, warnings, and failures, with per-page outcomes and a single inject-all action for the successful set.', newScreen:true,

screens.push({ id:'s39', group:'Schema · Edge cases', tag:'Schema · Conflict', title:'Existing hand-written schema found', desc:'Detection found schema already on the page that RankFrame did not write (hand-coded or another tool). The user chooses to keep, replace, or merge, never a silent overwrite.', newScreen:true,

screens.push({ id:'s40', group:'Schema · Edge cases', tag:'Schema · Confirm', title:'Delete schema confirmation', desc:'A destructive delete is gated behind a modal that states exactly what is removed and that the head block updates on the next publish. No accidental one-click deletes.', newScreen:true,

screens.push({ id:'s41', group:'Schema · Edge cases', tag:'Schema · Verification', title:'GSC not connected', desc:'Verification needs a Google Search Console property, and none is connected. The tab explains why and routes to connect, instead of showing a broken verification panel.', newScreen:true,

screens.push({ id:'s43', group:'LLM SEO · Edge cases', tag:'LLM SEO · Score', title:'Low score (many fixes)', desc:'A weak citability result. The same six-factor model surfaces a red score with the highest-leverage fixes ranked first, so a poor result is still actionable.', newScreen:true,

/* ===== RENDER ===== */
function tileIcon(s){
  const g = (s.group||'').toLowerCase();
  const t = (s.title||'').toLowerCase();
  if(g.indexOf('multi-user')>-1){
    if(t.indexOf('blocked')>-1||t.indexOf('permission')>-1) return ico.lock;
    if(t.indexOf('team')>-1||t.indexOf('invite')>-1||t.indexOf('seat')>-1) return ico.user;
    if(t.indexOf('lock')>-1||t.indexOf('concurrent')>-1) return ico.lock;
    if(t.indexOf('activity')>-1||t.indexOf('audit')>-1) return ico.clock;
    return ico.user;
  }
  if(g.indexOf('edge')>-1){
    if(t.indexOf('fail')>-1||t.indexOf('error')>-1||t.indexOf('denied')>-1) return ico.alert;
    if(t.indexOf('limit')>-1||t.indexOf('quota')>-1) return ico.zap;
    if(t.indexOf('not connected')>-1||t.indexOf('not crawled')>-1||t.indexOf('not enough')>-1||t.indexOf('no layer')>-1) return ico.info;
    if(t.indexOf('conflict')>-1||t.indexOf('existing')>-1) return ico.alert;
    if(t.indexOf('confirm')>-1||t.indexOf('delete')>-1) return ico.trash;
    if(t.indexOf('result')>-1) return ico.layers;
    if(t.indexOf('applied')>-1) return ico.check;
    if(t.indexOf('speakable')>-1) return ico.brain;
    if(t.indexOf('running')>-1) return ico.refresh;
    return ico.alert;
  }
  if(g.indexOf('llm')===0){
    if(g.indexOf('score')>-1) return ico.target;
    if(g.indexOf('faq')>-1) return ico.help;
    if(g.indexOf('preview')>-1) return ico.brain;
    if(g.indexOf('citation')>-1) return ico.quote;
    if(g.indexOf('entity')>-1) return ico.layers;
    return ico.brain;
  }
  if(g.indexOf('library')>-1) return ico.layers;
  if(g.indexOf('verification')>-1) return ico.check;
  if(g.indexOf('settings')>-1) return ico.cog;
  if(t.indexOf('generat')>-1||t.indexOf('inject')>-1) return ico.sparkles;
  if(t.indexOf('detect')>-1||t.indexOf('scan')>-1) return ico.search;
  if(t.indexOf('success')>-1) return ico.check;
  if(t.indexOf('regenerate')>-1) return ico.refresh;
  if(t.indexOf('conflict')>-1) return ico.alert;
  if(t.indexOf('pick')>-1) return ico.pages;
  return ico.schema_tag;
}
function buildContactSheet(){
  return '<div class="contact-sheet">'+screens.filter(s=>s.id!=='s1').map(s=>
    '<a class="cs-tile '+(s.newScreen?'new-screen':'')+'" href="#'+s.id+'"><div class="cs-tile-top">'+tileIcon(s)+'</div><div class="cs-tile-info"><div class="cs-tile-num">'+s.id.toUpperCase()+'</div><div class="cs-tile-title">'+s.title+'</div><div class="cs-tile-tag">'+s.tag+'</div></div></a>'
  ).join('')+'</div>';
}

const root = document.getElementById('screens-root');
const nav = document.getElementById('proto-nav');
let lastGroup = '';
screens.forEach(s=>{
  if(s.group && s.group !== lastGroup){
    const gt = document.createElement('div');
    gt.className='proto-nav-section-title';
    gt.textContent=s.group;
    nav.appendChild(gt);
    lastGroup=s.group;
  }
  const a = document.createElement('a');
  a.className='proto-nav-item'+(s.newScreen?' new-screen':'');
  a.href='#'+s.id;
  a.innerHTML='<span class="num">'+s.id.replace('s','')+'</span><span>'+s.title+'</span>';
  nav.appendChild(a);

  const sec = document.createElement('section');
  sec.className='state-section';
  sec.id=s.id;
  const body = s.body==='__CONTACT_SHEET__' ? buildContactSheet() : s.body;
  let annoHTML='';
  if(s.anno){
    annoHTML='<div class="proto-anno"><h3>Design notes</h3><div class="proto-anno-grid">'+
      s.anno.map(a=>'<div class="proto-anno-item"><dt>'+a[0]+'</dt><dd>'+a[1]+'</dd></div>').join('')+'</div></div>';
  }
  sec.innerHTML='<div class="proto-screen-head"><span class="proto-tag'+(s.newScreen?' new':'')+'">'+s.tag+'</span><h1>'+s.title+'</h1><p>'+s.desc+'</p></div>'+body+annoHTML;
  root.appendChild(sec);
});

/* scroll-spy active nav */
const navItems = Array.from(nav.querySelectorAll('.proto-nav-item'));
const obs = new IntersectionObserver(entries=>{
  entries.forEach(e=>{
    if(e.isIntersecting){
      navItems.forEach(n=>n.classList.toggle('active', n.getAttribute('href')==='#'+e.target.id));
    }
  });
}, {rootMargin:'-40% 0px -55% 0px'});
screens.forEach(s=>{ const el=document.getElementById(s.id); if(el) obs.observe(el); });
</script>

<script id="shell-script">
  var stage=document.getElementById("stage");
  var chooser=document.getElementById("chooser");
  var switchBtns=Array.prototype.slice.call(document.querySelectorAll(".vw-switch button"));
  var current=null;
  function mount(target){
    if(current===target){ return; }
    stage.innerHTML="";
    var tplId={content:"tpl-content",multiuser:"tpl-multi",schema:"tpl-schema"}[target];
    var tpl=document.getElementById(tplId);
    var node=tpl.content.cloneNode(true);
    stage.appendChild(node);
    // re-execute scripts (cloned scripts do not run); wrap each in an IIFE to keep top-level consts local
    Array.prototype.slice.call(stage.querySelectorAll("script")).forEach(function(old){
      var s=document.createElement("script");
      s.textContent="(function(){\n"+old.textContent+"\n})();";
      old.parentNode.replaceChild(s, old);
    });
    current=target;
    switchBtns.forEach(function(b){ b.classList.toggle("active", b.dataset.target===target); });
    document.body.classList.remove("rf-home"); document.body.classList.add("rf-app");
    chooser.classList.add("hidden");
    location.hash=target;
    window.scrollTo(0,0);
  }
  function goHome(){
    stage.innerHTML=""; current=null;
    document.body.classList.remove("rf-app"); document.body.classList.add("rf-home");
    chooser.classList.remove("hidden");
    location.hash="";
  }
  Array.prototype.slice.call(document.querySelectorAll(".ch-card")).forEach(function(c){ c.addEventListener("click", function(){ mount(c.dataset.target); }); });
  switchBtns.forEach(function(b){ b.addEventListener("click", function(){ mount(b.dataset.target); }); });
  document.getElementById("homeBtn").addEventListener("click", goHome);
  var initial=(location.hash||"").replace("#","");
  if(initial==="content"||initial==="multiuser"||initial==="schema"){ mount(initial); }
</script>
